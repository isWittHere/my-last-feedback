<body>

<div class="container">
  <div id="loading" class="loading">正在加载 Sessions…</div>
  <div id="nav-pager" class="hidden">
    <div id="nav-scroll">
      <div id="panel-home" class="panel"></div>
      <div id="panel-callers" class="panel"></div>
      <div id="panel-settings" class="panel"></div>
    </div>
  </div>
  <nav id="main-tabbar" class="tabbar hidden"></nav>
  <div id="app" class="hidden"></div>
</div>

<script>
/* ========= MLFB 手机远程 UI · 业务逻辑 ========= */
/* 注：UI 骨架、CSS、SVG sprite、topbar/bottombar/tabbar 均为 MLFB 自有实现 */

const STORAGE_KEY = "mlfb_mobile_v1";

const State = {
  sessions: [],
  callers: [],
  meta: null,
  current: null,        // 当前查看的 session（进入 session-mode 时设置）
  storage: null,
  currentPage: "home",  // home | callers | settings | detail
  _detailReturnPage: "home",
  _navIdx: 0,
  _navTab: "home",
  _homeFilter: { remote: "all", workspace: "all", caller: "all" },
  _detailDrawerOpen: false,
  _showTestLog: false,
  _showGit: false,
  _showImages: false,
  inputExpanded: false,   // 详情页输入栏是否展开
  submitMenuOpen: false,  // 提交弹出面板是否展开
  callerMenuOpen: false,  // 左下角 caller 列表弹出是否展开
};

/* 内置 prompt 快捷键（PC 版 prompts 默认为空，由用户配置；这里提供一组手机常用短语） */
const BUILTIN_PROMPTS = [
  { name: "继续",     icon: "ph-arrow-right", content: "继续" },
  { name: "好的",     icon: "ph-check",       content: "好的，按你建议的做。" },
  { name: "先分析",   icon: "ph-magnifying-glass",      content: "先不要改代码，分析后给我方案。" },
  { name: "写测试",   icon: "ph-list-numbers", content: "请补一个最小化的测试用例来验证。" },
  { name: "怎么办",   icon: "ph-chat-circle-text",     content: "我不确定该怎么做，你判断。" },
];

/* 内置 quick actions（与 PC QuickActions.tsx 对齐） */
const BUILTIN_QUICK_ACTIONS = [
  { key: "start",   label: "开始", text: "Start the task",                                               icon: "ph-play"   },
  { key: "analyze", label: "分析", text: "Please analyze the user requirements or perform a deeper analysis", icon: "ph-magnifying-glass" },
  { key: "fix",     label: "修复", text: "Please find the root cause and fix the issue",                 icon: "ph-wrench" },
  { key: "explain", label: "解释", text: "Please explain this to me in detail first",                    icon: "ph-chat-circle-text"},
];

function loadStorage(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const o = JSON.parse(raw);
      if(!o.settings) o.settings = { theme: "auto", fontSize: "medium" };
      if(!o.localEdits) o.localEdits = {};
      return o;
    }
  }catch(e){}
  return { settings: { theme: "auto", fontSize: "medium" }, localEdits: {} };
}
function saveStorage(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(State.storage)); }catch(e){}
}

/* ========= 工具 ========= */
function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function relativeTime(iso){
  const t = new Date(iso).getTime();
  const now = Date.now();
  const d = Math.max(0, now - t);
  const m = Math.floor(d/60000);
  if(m < 1) return "刚刚";
  if(m < 60) return m + " 分钟前";
  const h = Math.floor(m/60);
  if(h < 24) return h + " 小时前";
  const days = Math.floor(h/24);
  if(days < 30) return days + " 天前";
  return new Date(iso).toLocaleDateString();
}
function callerOf(id){
  return State.callers.find(c=>c.id===id) || { id, name: id, alias: "", color: "#888" };
}
function initials(name){
  if(!name) return "?";
  const parts = String(name).trim().split(/\s+/);
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

/**
 * Identicon 生成（与 PC 端 IdenticonAvatar.tsx 算法保持一致）
 * FNV-1a 双轮 hash → 15 bit → 5x5 左右对称网格
 */
function _identiconGrid(key){
  let hash = 0x811c9dc5;
  for(let i=0;i<key.length;i++){ hash ^= key.charCodeAt(i); hash = (hash * 0x01000193) >>> 0; }
  let hash2 = hash;
  for(let i=0;i<key.length;i++){ hash2 ^= key.charCodeAt(key.length-1-i); hash2 = (hash2 * 0x01000193) >>> 0; }
  const bits = (hash | (hash2 << 16)) >>> 0;
  const grid = [];
  for(let row=0;row<5;row++){
    const r = [false,false,false,false,false];
    for(let col=0;col<3;col++){
      const bitIndex = row*3 + col;
      const filled = ((bits >> bitIndex) & 1) === 1;
      r[col] = filled;
      if(col < 2) r[4-col] = filled;
    }
    grid.push(r);
  }
  return grid;
}
function hexToRgbTriple(hex){
  const m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex||''));
  if(!m) return '31,35,41';
  let h = m[1];
  if(h.length===3) h = h.split('').map(c=>c+c).join('');
  const n = parseInt(h,16);
  return `${(n>>16)&255},${(n>>8)&255},${n&255}`;
}
function identiconSvg(alias, color, size){
  const grid = _identiconGrid(String(alias || '?'));
  // 空格子固定用中性浅色（避免 caller 色过深时与背景混在一起看不见），
  // 只有"填充"的格子才用 caller 主题色
  const empty = 'rgba(127,127,127,0.18)';
  let rects = '';
  for(let row=0;row<5;row++){
    for(let col=0;col<5;col++){
      if(grid[row][col]) rects += `<rect x="${col}" y="${row}" width="1" height="1" fill="${color}"/>`;
    }
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 5 5" shape-rendering="crispEdges" style="border-radius:4px;display:block;flex-shrink:0">
    <rect width="5" height="5" fill="${empty}" rx="0.4"/>
    ${rects}
  </svg>`;
}
/* 极简 markdown → html（粗体、斜体、代码、标题、列表、链接）
   渲染策略：
   1. 先抽出 fenced code block 用占位符保护（内含任意字符）
   2. escapeHtml，再做行内替换（粗体/斜体/行内 code/链接）
   3. 按行扫描，遇到块级语法（h1-3、列表、空行）就 flush 当前段落
   4. 连续非块级行聚合成 <p>，段内软换行转 <br>
   5. 最后恢复 code block
   避免了旧版 "\n → <br>" 造成的块级元素前后多 1 行空白问题 */
function renderMarkdown(md){
  if(!md) return "";
  // 1. 保护 fenced code block
  const codes = [];
  let s = md.replace(/```([\s\S]*?)```/g, (_, c) => {
    codes.push(c);
    return `\u0000CODE${codes.length - 1}\u0000`;
  });
  // 2. HTML 转义 + 行内标记
  s = escapeHtml(s);
  s = s.replace(/`([^`\n]+)`/g, '<code style="background:var(--card-2);padding:1px 6px;border-radius:4px;font-size:.92em">$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--primary);text-decoration:underline">$1</a>');
  // 3. 按行扫描
  const lines = s.split('\n');
  const out = [];
  let para = [];
  const flushPara = () => {
    if(para.length){
      out.push('<p style="margin:0 0 8px;padding:0">' + para.join('<br>') + '</p>');
      para = [];
    }
  };
  for(const line of lines){
    let m;
    if(m = line.match(/^###\s+(.+)$/)){
      flushPara();
      out.push(`<h3>${m[1]}</h3>`);
    } else if(m = line.match(/^##\s+(.+)$/)){
      flushPara();
      out.push(`<h2>${m[1]}</h2>`);
    } else if(m = line.match(/^#\s+(.+)$/)){
      flushPara();
      out.push(`<h1>${m[1]}</h1>`);
    } else if(m = line.match(/^- \[x\]\s+(.+)$/)){
      flushPara();
      out.push(`<div style="padding:2px 0;display:flex;align-items:center;gap:6px"><i class="ph ph-check-square icon" style="color:var(--success);font-size:1.4em;flex-shrink:0"></i><span>${m[1]}</span></div>`);
    } else if(m = line.match(/^- \[ \]\s+(.+)$/)){
      flushPara();
      out.push(`<div style="padding:2px 0;display:flex;align-items:center;gap:6px"><i class="ph ph-square icon" style="color:var(--muted);font-size:1.4em;flex-shrink:0"></i><span>${m[1]}</span></div>`);
    } else if(m = line.match(/^- (.+)$/)){
      flushPara();
      out.push(`<div style="padding:2px 0;padding-left:12px;position:relative">•&nbsp;${m[1]}</div>`);
    } else if(line.trim() === ''){
      flushPara();
    } else {
      para.push(line);
    }
  }
  flushPara();
  // 4. 恢复 code block
  let html = out.join('');
  html = html.replace(/\u0000CODE(\d+)\u0000/g, (_, i) => {
    const raw = codes[parseInt(i,10)];
    const nlIdx = raw.indexOf('\n');
    let lang = '';
    let codeContent = raw;
    if(nlIdx !== -1){
      const firstLine = raw.slice(0, nlIdx).trim();
      if(firstLine && /^[a-zA-Z0-9_+#.-]+$/.test(firstLine)){
        lang = firstLine;
        codeContent = raw.slice(nlIdx + 1);
      }
    }
    const code = escapeHtml(codeContent);
    const langHeader = lang
      ? `<div style="padding:4px 10px 3px;font-size:var(--fs-xs);color:var(--muted);font-family:var(--font-mono,ui-monospace,monospace);letter-spacing:.02em">${escapeHtml(lang)}</div>`
      : '';
    return `<div style="background:var(--card-2);border-radius:6px;overflow:hidden;margin:8px 0;max-width:100%">${langHeader}<pre style="padding:10px;overflow-x:auto;font-size:var(--fs-md);line-height:1.5;margin:0;white-space:pre;word-break:normal;overflow-wrap:normal"><code>${code}</code></pre></div>`;
  });
  return html;
}

/* ========= 自定义确认弹窗 ========= */
function showConfirm(msg, okText, cancelText){
  return new Promise(resolve=>{
    let mask = document.getElementById('modal-confirm');
    if(!mask){
      mask = document.createElement('div');
      mask.id = 'modal-confirm';
      mask.className = 'modal-mask';
      document.body.appendChild(mask);
    }
    mask.innerHTML = `<div class="modal-sheet">
      <div class="modal-msg">${escapeHtml(msg)}</div>
      <div class="modal-actions">
        <button class="modal-cancel" id="modal-no">${escapeHtml(cancelText||'取消')}</button>
        <button class="modal-ok" id="modal-yes">${escapeHtml(okText||'确定')}</button>
      </div>
    </div>`;
    requestAnimationFrame(()=> mask.classList.add('open'));
    const close = (val)=>{ mask.classList.remove('open'); setTimeout(()=>{ mask.innerHTML=''; }, 250); resolve(val); };
    mask.querySelector('#modal-yes').onclick = ()=> close(true);
    mask.querySelector('#modal-no').onclick = ()=> close(false);
    mask.onclick = (e)=>{ if(e.target === mask) close(false); };
  });
}

/* ========= 应用 ========= */
const app = {
  _navAnimating: false,
  _animateNav: false,

  async init(){
    State.storage = loadStorage();
    this.applyTheme();
    this.applyFontSize();
    try{
      const resp = await fetch("sessions.json", { cache:"no-cache" });
      if(!resp.ok) throw new Error("HTTP "+resp.status);
      const data = await resp.json();
      State.sessions = data.sessions || [];
      State.callers = data.callers || [];
      State.meta = data.meta || {};
      // 合并本地编辑（离线草稿）
      for(const sid in State.storage.localEdits){
        const sess = State.sessions.find(s=>s.id===sid);
        if(sess) Object.assign(sess, State.storage.localEdits[sid]);
      }
    }catch(err){
      document.getElementById("loading").innerHTML =
        `<div style="color:var(--danger)">Session 数据加载失败：${escapeHtml(err.message)}<br><br>
        如果你是双击打开此 HTML 文件，请改用本地服务器：<br>
        <code>python -m http.server 8000</code></div>`;
      return;
    }
    document.getElementById("loading").classList.add("hidden");
    this.goHome();
  },

  applyTheme(){
    const t = (State.storage.settings && State.storage.settings.theme) || "auto";
    const root = document.documentElement;
    if(t === "auto") root.removeAttribute("data-theme");
    else root.setAttribute("data-theme", t);
    try{
      if(window.MlfbBridge && typeof window.MlfbBridge.setTheme === "function"){
        const isDark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
        window.MlfbBridge.setTheme(isDark ? "dark" : "light");
      }
    }catch(e){}
  },
  setTheme(t){
    State.storage.settings = State.storage.settings || {};
    State.storage.settings.theme = t;
    saveStorage();
    this.applyTheme();
    if(State.currentPage === "settings") this.showSettings();
  },
  applyFontSize(){
    const fs = (State.storage.settings && State.storage.settings.fontSize) || "medium";
    if(fs === "medium") document.documentElement.removeAttribute('data-fs');
    else document.documentElement.setAttribute('data-fs', fs);
  },
  setFontSize(v){
    State.storage.settings = State.storage.settings || {};
    State.storage.settings.fontSize = v;
    saveStorage();
    this.applyFontSize();
    if(State.currentPage === "settings") this.showSettings();
  },

  setTitle(t){ State.pageTitle = t; },

  enterNavMode(){
    document.body.classList.add("nav-mode");
    document.body.classList.remove("session-mode");
    document.getElementById("nav-pager").classList.remove("hidden");
    document.getElementById("main-tabbar").classList.remove("hidden");
    document.getElementById("app").classList.add("hidden");
  },
  exitNavMode(){
    document.body.classList.remove("nav-mode");
    document.getElementById("nav-pager").classList.add("hidden");
    document.getElementById("main-tabbar").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
  },

  _syncNativeToolbar(title, showBack){
    if(!window.MlfbBridge || !window.MlfbBridge.showToolbar) return;
    if(title === false){
      document.documentElement.style.setProperty('--sat', '0px');
      window.MlfbBridge.hideToolbar();
      document.body.classList.remove('native-toolbar');
    } else {
      const h = window.MlfbBridge.getToolbarHeight ? window.MlfbBridge.getToolbarHeight() : 0;
      document.documentElement.style.setProperty('--sat', h + 'px');
      window.MlfbBridge.showToolbar(String(title), showBack ? 'true' : 'false');
      document.body.classList.add('native-toolbar');
    }
  },

  _updateTabbar(active){
    const mk = (id, label, icon) =>
      `<button class="${active===id?'active':''}" onclick="app.navTab('${id}')">
         <i class="ph ${icon} icon"></i><span>${label}</span>
       </button>`;
    document.getElementById("main-tabbar").innerHTML =
      mk('home','首页','ph-house') +
      mk('callers','最近caller','ph-users-three') +
      mk('settings','设置','ph-gear');
  },

  _setNavPage(idx, animate){
    const scroller = document.getElementById('nav-scroll');
    State._navIdx = idx;
    const target = idx * scroller.offsetWidth;
    if(!animate){
      this._navAnimating = true;
      scroller.scrollTo({left: target, behavior:'instant'});
      requestAnimationFrame(()=>{ this._navAnimating = false; });
      return;
    }
    const start = scroller.scrollLeft;
    const dist = target - start;
    if(!dist) return;
    this._navAnimating = true;
    scroller.style.scrollSnapType = 'none';
    const dur = 200;
    const t0 = performance.now();
    const step = (now) => {
      const p = Math.min((now - t0) / dur, 1);
      const ease = 1 - Math.pow(1 - p, 3);
      scroller.scrollLeft = start + dist * ease;
      if(p < 1) requestAnimationFrame(step);
      else { scroller.style.scrollSnapType = ''; this._navAnimating = false; }
    };
    requestAnimationFrame(step);
  },

  navTab(tab){
    const tabs = ['home','callers','settings'];
    const newIdx = tabs.indexOf(tab);
    const oldIdx = State._navIdx ?? 0;
    if(newIdx === oldIdx) return;
    this._animateNav = true;
    if(tab === 'home') this.goHome();
    else if(tab === 'callers') this.showRecentCallers();
    else if(tab === 'settings') this.showSettings();
    this._animateNav = false;
    this._setNavPage(newIdx, true);
  },

  /* ========= 首页（4 区域筛选 + 统一 session 列表） ========= */
  goHome(){
    State.current = null;
    State.currentPage = "home";
    State._navTab = "home";
    this.enterNavMode();
    if(!this._animateNav) this._setNavPage(0, false);
    this._updateTabbar("home");
    this._syncNativeToolbar("MLFB 远程", false);
    this.setTitle("首页");

    const f = State._homeFilter;

    // —— 收集 remote / workspace 候选项 ——
    // 目前 mock 数据里没有 remote（PC 宿主）字段，统一走 "本机"；
    // Phase 2 多设备时会从 sessions 里带回 remote 标识。
    const remotes = [{ id: 'local', label: '本机' }];
    const workspaces = Array.from(new Set(State.sessions.map(s => s.projectDirectory).filter(Boolean)));

    // —— Chip 渲染 ——
    const chip = (active, label, count, onClick, color) => {
      const style = active && color
        ? `background:${color};color:#fff;border-color:${color}`
        : (color ? `border:1px solid ${color}33;color:${color}` : '');
      return `<button class="cat-chip${active?' active':''}" style="${style}" onclick="${onClick}">${escapeHtml(label)}${count!=null?` ${count}`:''}</button>`;
    };

    const remoteChips = remotes.map(r =>
      chip(f.remote === r.id || (f.remote === 'all' && r.id === 'local'), r.label, State.sessions.length,
           `app.setHomeFilter('remote','${r.id}')`)
    ).join("");

    const wsChips = [
      chip(f.workspace === 'all', '全部', State.sessions.length, `app.setHomeFilter('workspace','all')`),
      ...workspaces.map(w => {
        const cnt = State.sessions.filter(s => s.projectDirectory === w).length;
        // 末级目录名作短标签
        const short = String(w).split(/[\\/]/).filter(Boolean).pop() || w;
        return chip(f.workspace === w, short, cnt, `app.setHomeFilter('workspace',${JSON.stringify(w).replace(/"/g,'&quot;')})`);
      })
    ].join("");

    // —— Caller 头像列（最近 3 个 + 更多） ——
    const callersSorted = State.callers.slice().sort((a, b) => {
      const latestOf = id => State.sessions.filter(s => s.callerId === id)
        .reduce((m, s) => !m || new Date(s.createdAt) > new Date(m.createdAt) ? s : m, null);
      return new Date((latestOf(b.id)||{createdAt:0}).createdAt) - new Date((latestOf(a.id)||{createdAt:0}).createdAt);
    });
    const topCallers = callersSorted.slice(0, 3);
    const allBtn = `<button class="hca-item${f.caller==='all'?' active':''}" onclick="app.setHomeFilter('caller','all')">
      <span class="hca-more-ring" style="background:var(--sel-bg)"><i class="ph ph-list icon" style="font-size:18px;color:var(--${f.caller==='all'?'primary':'muted'})"></i></span>
      <span class="hca-name" style="color:var(--${f.caller==='all'?'text':'muted'})">全部</span>
    </button>`;
    const callerAvatarHtml = [allBtn].concat(topCallers.map(c => {
      const isActive = f.caller === c.id;
      const pendingCount = State.sessions.filter(s => s.callerId === c.id && s.status === 'pending').length;
      const dot = pendingCount > 0 ? `<span class="cs-dot" style="position:absolute;top:1px;right:1px;border-color:var(--card);width:10px;height:10px;border-width:2px"></span>` : '';
      return `<button class="hca-item${isActive?' active':''}" onclick="app.setHomeFilter('caller','${c.id}')">
        <span style="position:relative;display:inline-block">
          <span class="hca-ring">${identiconSvg(c.alias||c.id, c.color, 44)}</span>${dot}
        </span>
        <span class="hca-name">${escapeHtml(c.alias||c.name)}</span>
      </button>`;
    })).join('');
    const callerMoreBtn = callersSorted.length > 3
      ? `<button class="hca-item" onclick="app.navTab('callers')">
          <span class="hca-more-ring"><i class="ph ph-users-three icon" style="font-size:20px;color:var(--muted)"></i></span>
          <span class="hca-name" style="color:var(--muted)">更多</span>
        </button>`
      : '';

    // —— 应用筛选 ——
    let list = State.sessions.slice();
    if(f.workspace !== 'all') list = list.filter(s => s.projectDirectory === f.workspace);
    if(f.caller !== 'all') list = list.filter(s => s.callerId === f.caller);
    list.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

    document.getElementById("panel-home").innerHTML = `
      <div class="section">
        <div class="section-title">远程电脑</div>
        <div class="category-list">${remoteChips}</div>
      </div>
      <div class="section">
        <div class="section-title">工作区</div>
        <div class="category-list">${wsChips}</div>
      </div>
      <div class="home-caller-sticky">
        <div class="section-title">Caller</div>
        <div class="home-caller-row" style="margin:0 -10px;padding-left:6px;padding-right:6px">${callerAvatarHtml}${callerMoreBtn}</div>
      </div>
      <div class="section" style="padding:0">
        <div class="section-title" style="padding:8px 16px 6px;display:flex;align-items:center;gap:5px">${f.caller !== 'all' ? `<span style="width:16px;height:16px;border-radius:3px;overflow:hidden;flex-shrink:0;display:inline-block">${identiconSvg(callerOf(f.caller).alias||callerOf(f.caller).id, callerOf(f.caller).color, 16)}</span><span style="flex:1">${escapeHtml(callerOf(f.caller).alias||callerOf(f.caller).name)} 的 Sessions</span>` : '<span style="flex:1">Session 列表</span>'} <span style="color:var(--muted);font-weight:400;margin-left:auto">${list.length}</span></div>
        <div class="session-list" style="padding:0 6px 8px">${this._renderSessionList(list, f.caller === 'all')}</div>
      </div>
    `;
    const homeCallerSticky = document.querySelector('#panel-home .home-caller-sticky');
    if(homeCallerSticky) document.documentElement.style.setProperty('--home-caller-sticky-h', homeCallerSticky.offsetHeight + 'px');
  },

  /** 筛选器统一入口 */
  setHomeFilter(key, val){
    if(key in State._homeFilter){
      State._homeFilter[key] = val;
      this.goHome();
    }
  },

  /** 复用：PC 侧栏风格的紧凑 session 列表（d-item 样式，无分割线，按时间分组） */
  _renderSessionList(list, showCaller = true){
    if(!list.length){
      return `<div class="empty"><i class="ph ph-smiley icon"></i> 没有匹配的 session</div>`;
    }
    const now = new Date();
    const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    const yesterdayStart = todayStart - 86400000;
    const weekAgoStart = todayStart - 7 * 86400000;
    const bucketOf = iso => {
      const t = new Date(iso).getTime();
      if(t >= todayStart) return 'today';
      if(t >= yesterdayStart) return 'yesterday';
      if(t >= weekAgoStart) return 'lastWeek';
      return 'earlier';
    };
    const groups = {
      today:     { label:'今天',     items: [] },
      yesterday: { label:'昨天',     items: [] },
      lastWeek:  { label:'最近一周', items: [] },
      earlier:   { label:'更早',     items: [] },
    };
    list.forEach(s => groups[bucketOf(s.createdAt)].items.push(s));
    const renderItem = s => {
      const c = callerOf(s.callerId);
      const iconName = s.status === 'pending' ? 'ph-circle-dashed'
        : s.status === 'responded' ? 'ph-check-circle'
        : 'ph-x-circle';
      return `<button class="d-item" onclick="app.openSession('${s.id}')">
        <div class="d-item-r1">
          <span class="d-item-icon ${s.status}"><i class="ph ${iconName}"></i></span>
          <span class="d-item-title${s.status==='responded'?' responded':''}">${escapeHtml(s.requestName || 'Untitled')}</span>
        </div>
        <div class="d-item-r2">
          ${showCaller ? `<span style="display:inline-flex;align-items:center;gap:4px"><span style="width:14px;height:14px;border-radius:2px;overflow:hidden;flex-shrink:0;display:inline-block">${identiconSvg(c.alias||c.id, c.color, 14)}</span>${escapeHtml(c.alias||c.name)}</span>` : ''}
          <span class="d-item-time">${relativeTime(s.createdAt)}</span>
        </div>
      </button>`;
    };
    return ['today','yesterday','lastWeek','earlier'].map(k => {
      const g = groups[k];
      if(!g.items.length) return '';
      return `<div class="d-group">
        <div class="sl-group-header">
          <div class="sl-group-row">
            <span class="sl-group-label">${g.label}</span>
            <span class="sl-group-count">${g.items.length}</span>
          </div>
        </div>
        ${g.items.map(renderItem).join('')}
      </div>`;
    }).join('');
  },

  /* ========= Caller 面板 ========= */
  showRecentCallers(){
    State.current = null;
    State.currentPage = "callers";
    State._navTab = "callers";
    this.enterNavMode();
    if(!this._animateNav) this._setNavPage(1, false);
    this._updateTabbar("callers");
    this._syncNativeToolbar("Caller", false);
    this.setTitle("Caller");

    if(!State._expandedCallers) State._expandedCallers = new Set();

    const groups = State.callers.map(c => {
      const sessions = State.sessions.filter(s => s.callerId === c.id)
        .sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
      return { caller: c, sessions, latest: sessions[0], pending: sessions.filter(s=>s.status==='pending').length };
    }).filter(g => g.sessions.length > 0)
      .sort((a,b) => {
        const ta = a.latest ? new Date(a.latest.createdAt).getTime() : 0;
        const tb = b.latest ? new Date(b.latest.createdAt).getTime() : 0;
        return tb - ta;
      });

    const rowsHtml = groups.length === 0
      ? `<div class="empty"><i class="ph ph-smiley icon"></i> 还没有任何 Caller</div>`
      : groups.map(g => {
          const c = g.caller;
          const isExpanded = State._expandedCallers.has(c.id);
          const pendingDot = g.pending > 0
            ? `<span class="cs-dot" style="position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-width:2px;border-color:var(--card)"></span>`
            : '';
          const sessionsHtml = isExpanded
            ? `<div class="caller-sessions-list">${this._renderSessionList(g.sessions, false)}</div>`
            : '';
          return `<div class="caller-row-wrap">
            <button class="d-item${isExpanded ? ' caller-row-sticky' : ''}" onclick="app.toggleCallerExpand('${c.id}')" style="${isExpanded ? 'position:sticky;top:6px;z-index:5;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 -6px 0 var(--bg)' : 'border:1px solid transparent;border-radius:10px'}">
              <div style="display:flex;align-items:center;gap:10px">
                <span style="position:relative;flex-shrink:0">
                  <span style="border-radius:5px;overflow:hidden;display:block;width:36px;height:36px">${identiconSvg(c.alias||c.id, c.color, 36)}</span>
                  ${pendingDot}
                </span>
                <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
                  <div style="display:flex;align-items:center;gap:6px;min-width:0">
                    <span style="font-weight:500;font-size:var(--fs-base);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(c.alias||c.name)}</span>
                    <span style="display:inline-flex;align-items:center;gap:4px;flex-shrink:0">
                      <span class="s-badge" style="font-size:10px;padding:1px 5px;background:var(--sel-bg);color:var(--muted)"><i class="ph ph-chat-dots" style="font-size:9px"></i> ${g.sessions.length}</span>
                      ${g.pending > 0 ? `<span class="s-badge s-badge-warn" style="font-size:10px;padding:1px 5px"><i class="ph ph-circle-dashed" style="font-size:9px"></i> ${g.pending}</span>` : ''}
                    </span>
                  </div>
                  <div class="d-item-r2" style="padding-left:0;flex-wrap:wrap">
                    <span class="d-item-time">${relativeTime(g.latest.createdAt)}</span>
                    ${g.latest.projectDirectory ? `<span class="s-badge" style="font-size:10px;padding:1px 5px;background:var(--sel-bg);color:var(--muted);word-break:break-all;white-space:normal;vertical-align:middle"><i class="ph ph-file" style="font-size:9px"></i> ${escapeHtml(g.latest.projectDirectory)}</span>` : ''}
                  </div>
                </div>
                <i class="ph ph-caret-${isExpanded?'up':'down'} icon" style="color:var(--muted);font-size:14px;flex-shrink:0"></i>
              </div>
            </button>
            ${sessionsHtml}
          </div>`;
        }).join('');

    document.getElementById("panel-callers").innerHTML =
      `<div style="padding:6px 6px 100px">${rowsHtml}</div>`;
    const callersPanel = document.getElementById('panel-callers');
    const stickyCallerRow = callersPanel.querySelector('.caller-row-sticky');
    if(stickyCallerRow){
      callersPanel.style.setProperty('--caller-row-sticky-h', `${stickyCallerRow.offsetHeight}px`);
    } else {
      callersPanel.style.removeProperty('--caller-row-sticky-h');
    }
    if(this._callersPanelScrollListener){
      callersPanel.removeEventListener('scroll', this._callersPanelScrollListener);
      this._callersPanelScrollListener = null;
    }
  },

  toggleCallerExpand(id){
    if(!State._expandedCallers) State._expandedCallers = new Set();
    if(State._expandedCallers.has(id)){
      State._expandedCallers.delete(id);
    } else {
      State._expandedCallers.add(id);
    }
    this.showRecentCallers();
  },


  /** 点 caller 行 → 跳首页并按该 caller 过滤 */
  filterByCaller(id){
    State._homeFilter.caller = id;
    State._homeFilter.workspace = 'all';
    this._animateNav = true;
    this.goHome();
    this._setNavPage(0, true);
    this._animateNav = false;
  },

  /* ========= Session 详情（复用 session-mode） ========= */
  openSession(id){
    const s = State.sessions.find(x=>x.id===id);
    if(!s) return;
    if(State.currentPage !== "detail"){
      State._detailReturnPage = State.currentPage || State._navTab || "home";
    }
    State.current = JSON.parse(JSON.stringify(s));  // 深拷贝，支持本地编辑而不影响 mock
    State.currentPage = "detail";
    // 根据已有内容预展开对应附件面板，之后 toggle 完全由用户控制
    const cur = State.current;
    const curGa = cur.gitAction || { type: 'none' };
    State._showTestLog = !!(cur.testLogText && cur.testLogText.trim());
    State._showGit = !!(curGa.type && curGa.type !== 'none');
    State._showImages = (cur.images || []).length > 0;
    State._detailDrawerOpen = false;
    this.exitNavMode();
    document.body.classList.add("session-mode");
    this._syncNativeToolbar(false);
    this.renderDetail();
  },

  closeSession(){
    State.current = null;
    State.inputExpanded = false;
    State.submitMenuOpen = false;
    State.callerMenuOpen = false;
    document.body.classList.remove("session-mode");
    if(this._scrollListener){ window.removeEventListener('scroll', this._scrollListener); this._scrollListener = null; }
    if(this._bbRO){ this._bbRO.disconnect(); this._bbRO = null; }
    document.body.style.removeProperty('--bottombar-h');
    if(State._detailReturnPage === "callers") this.showRecentCallers();
    else if(State._detailReturnPage === "settings") this.showSettings();
    else this.goHome();
  },

  renderDetail(){
    const s = State.current;
    if(!s) return;
    const c = callerOf(s.callerId);
    const readonly = s.status !== "pending";

    /* Summary 卡 */
    const imagesHtml = (s.images && s.images.length)
      ? `<div class="q-images">${s.images.map(im=>`<img src="${im.dataUrl||''}" alt="${escapeHtml(im.name||'')}">`).join("")}</div>`
      : '';

      <div class="question-card">
        <div class="q-header q-header--caller">
          <div class="qh-avatar">${identiconSvg(c.alias||c.id, c.color, 32)}</div>
          <div class="qh-info">
            <div class="qh-name" style="color:${c.color}">${escapeHtml(c.alias||c.name)}</div>
            <div class="qh-sub">
              ${c.name && c.alias && c.name!==c.alias ? `<span>${escapeHtml(c.name)}</span>` : ''}
              <span>·</span><span>${escapeHtml(relativeTime(s.createdAt))}</span>
            </div>
          </div>
          <div class="qh-status">
            ${s.status==='pending' ? '<span class="qh-tag pending"><i class="ph ph-circle-dashed"></i>待处理</span>' : (s.status==='responded' ? '<span class="qh-tag responded"><i class="ph ph-check-circle"></i>已响应</span>' : '<span class="qh-tag cancelled"><i class="ph ph-x-circle"></i>已取消</span>')}
          </div>

        ${imagesHtml}
        ${this._renderQuestionsForm(s, c, readonly)}
      </div>
    `;

    /* Questions 已并入 summaryCard（PC 同款结构），此处 qCards 置空保留以兼容模板 */
    const qCards = '';

    /* 反馈输入区 (PC 风格 flat) */

    const ga = s.gitAction || { type: 'none', branchName: '' };
    const showTestLog = !!State._showTestLog;
    const showGit = !!State._showGit;
    const showImages = !!State._showImages;

    const attachBar = `
      <div class="attach-bar">
        <button class="attach-tag${showImages?' active':''}" style="${showImages?`--cc:${c.color}`:''}" ${readonly?'disabled':''} onclick="app.toggleImages()" title="附加图片">
          <i class="ph ph-image icon"></i>
          <span>附加图片</span>${images.length?`<span class="tag-count">${images.length}</span>`:''}
        </button>

          <i class="ph ph-terminal-window icon"></i>
          <span>附加日志</span>${(s.testLogText||'').length?`<span class="tag-count">${(s.testLogText||'').length}</span>`:''}
        </button>
        <button class="attach-tag${showGit?' active':''}" style="${showGit?`--cc:${c.color}`:''}" ${readonly?'disabled':''} onclick="app.toggleGit()">
          <i class="ph ph-git-branch icon"></i>
          <span>Git 操作${ga.type && ga.type!=='none'?' · '+ga.type:''}</span>
        </button>
      </div>
    `;

    const mainTa = readonly
      ? `<div class="feedback-readonly">${s.feedbackText ? renderMarkdown(s.feedbackText) : '<span style="color:var(--muted)">（无反馈）</span>'}</div>`
      : `<textarea class="feedback-main" rows="3" placeholder="向 ${escapeHtml(c.alias||c.name)}${c.name && c.alias && c.name!==c.alias?` (${escapeHtml(c.name)})`:''} 发送反馈...
Ctrl+Enter 提交，Ctrl+V 粘贴图片" oninput="app.setFeedback(this.value); app._autoSize(this)">${escapeHtml(s.feedbackText||'')}</textarea>`;

    const imgsPane = showImages ? `
      <div class="sub-pane imgs"><div class="img-thumbs">
        ${images.map((im,i)=>`<div class="thumb"><img src="${im.dataUrl||''}" alt="${escapeHtml(im.name||'')}">${readonly?'':`<button class="rm" onclick="app.removeImage(${i})" title="移除"><i class="ph ph-x icon"></i></button>`}</div>`).join('')}
        ${readonly?'':`<label class="thumb thumb-add" title="添加图片"><i class="ph ph-plus icon"></i><input type="file" accept="image/*" multiple onchange="app.pickImages(event)"></label>`}
      </div></div>` : '';

    const testLogPane = showTestLog ? `
      <div class="sub-pane logs">
        <textarea placeholder="粘贴测试日志（可选）..." ${readonly?'readonly':''} oninput="app.setTestLog(this.value)">${escapeHtml(s.testLogText||'')}</textarea>

          ${gaBtn('create-branch','ph-git-branch','新分支')}
        </div>
        ${branchInput}
      </div>` : '';

    const feedbackPane = `
      <div class="feedback-pane">
        ${attachBar}
        ${imgsPane}
        ${testLogPane}
        ${gitPane}
        ${mainTa}
      </div>
    `;

    /* 悬浮三按钮栏 + 可展开输入区 + 提交弹出面板 */
    const pendingCount = (s.questions||[]).filter(q => !(q.answer||'').trim() && !(q.selectedOptions||[]).length).length;
    const promptsHtml = BUILTIN_PROMPTS.map(p=>`<button class="prompt-chip" onclick="app.applyPrompt(${JSON.stringify(p.content).replace(/"/g,'&quot;')});app.closeSubmitMenu()"><i class="ph ${p.icon||'ph-arrow-right'} icon"></i>${escapeHtml(p.name)}</button>`).join('');

    const inputExpanded = !!State.inputExpanded;
    const submitMenuOpen = !!State.submitMenuOpen;
    const callerMenuOpen = !!State.callerMenuOpen;

    const expandedPane = inputExpanded ? `
      <div class="expanded-input">
        ${feedbackPane}
      </div>` : '';

    const qaBtn = (a) => `<button onclick="app.submitWith(${JSON.stringify(a.text).replace(/"/g,'&quot;')})"><i class="ph ${a.icon} icon"></i>${escapeHtml(a.label)}</button>`;
    const hasText = !!(s.feedbackText||'').trim();
    const hasImages = Array.isArray(s.images) && s.images.length > 0;
    const hasTestLog = !!(s.testLogText||'').trim();
    const hasGit = !!(s.gitAction && s.gitAction.type && s.gitAction.type !== 'none');
    const hasAnswered = (s.questions||[]).some(q => (q.answer||'').trim() || (q.selectedOptions||[]).length);
    const canSend = hasText || hasImages || hasTestLog || hasGit || hasAnswered;
    const submitMenu = (!readonly && submitMenuOpen) ? `
      <div class="submit-menu-backdrop" onclick="app.closeSubmitMenu()"></div>
      <div class="submit-menu" onclick="event.stopPropagation()">
        <button class="sm-cancel" onclick="app.cancelSession()"><i class="ph ph-x-circle icon"></i>取消 session</button>
        ${promptsHtml ? `<div class="sm-prompts">${promptsHtml}</div>` : ''}
        <div class="sm-actions">
          ${BUILTIN_QUICK_ACTIONS.map(qaBtn).join('')}
        </div>
        <button class="sm-send" ${canSend?'':'disabled'} onclick="app.submitWith(null)"><i class="ph ph-paper-plane-tilt icon"></i>直接发送${pendingCount?` (${pendingCount})`:''}</button>
      </div>` : '';

    const callerMenuItem = (ci) => {
      const isActive = ci.id === c.id;
      const pending = State.sessions.filter(x => x.callerId === ci.id && x.status === 'pending').length;
      const sub = ci.name && ci.alias && ci.name !== ci.alias ? ci.name : '';
      return `<button class="cm-item${isActive?' active':''}" onclick="app.pickCallerFromMenu('${ci.id}')">
        ${identiconSvg(ci.alias||ci.id, ci.color, 28)}
        <div class="cm-info"><div class="cm-name">${escapeHtml(ci.alias||ci.name)}</div>${sub?`<div class="cm-sub">${escapeHtml(sub)}</div>`:''}</div>
        ${pending?`<span class="cm-badge">${pending}</span>`:''}
      </button>`;
    };
    const backEntryLabel = State._detailReturnPage === 'callers' ? '返回 Caller 页' : (State._detailReturnPage === 'settings' ? '返回设置' : '返回主页');
    const homeBtnTitle = State._detailReturnPage === 'callers' ? '切换 caller / 返回 Caller 页' : (State._detailReturnPage === 'settings' ? '切换 caller / 返回设置' : '切换 caller / 返回主页');
    const callerMenu = callerMenuOpen ? `
      <div class="caller-menu-backdrop" onclick="app.closeCallerMenu()"></div>
      <div class="caller-menu" onclick="event.stopPropagation()">
        <button class="cm-home" onclick="app.closeSession()"><i class="ph ph-house icon"></i>${backEntryLabel}</button>
        <div class="cm-list">${State.callers.map(callerMenuItem).join('')}</div>
      </div>` : '';

    const bottomBar = readonly
      ? `${expandedPane}
        <div class="float-bar fb-left">
          <button class="fb-home" onclick="app.openCallerMenu()" title="${homeBtnTitle}">
            ${identiconSvg(c.alias||c.id, c.color, 28)}
            <div class="fb-home-info">
              <div class="fb-home-name">${escapeHtml(c.alias||c.name)}</div>
              <div class="fb-home-sub">${s.projectDirectory ? escapeHtml(String(s.projectDirectory).split(/[\\/]/).filter(Boolean).pop()) : escapeHtml(c.name || '')}</div>
            </div>
          </button>
        </div>
        <div class="float-bar fb-right">
          <button class="fb-expand${inputExpanded?' active':''}" onclick="app.toggleInputExpanded()" title="${inputExpanded?'折叠':'查看反馈'}"><i class="ph ${inputExpanded?'ph-caret-down':'ph-note-pencil'} icon"></i><i class="ph ${s.status==='cancelled'?'ph-x-circle':'ph-check-circle'} fb-badge ${s.status==='cancelled'?'cancelled':'done'}"></i></button>
        </div>
        ${callerMenu}`
      : `${expandedPane}
        <div class="float-bar fb-left">
          <button class="fb-home" onclick="app.openCallerMenu()" title="${homeBtnTitle}">
            ${identiconSvg(c.alias||c.id, c.color, 28)}
            <div class="fb-home-info">
              <div class="fb-home-name">${escapeHtml(c.alias||c.name)}</div>
              <div class="fb-home-sub">${s.projectDirectory ? escapeHtml(String(s.projectDirectory).split(/[\\/]/).filter(Boolean).pop()) : escapeHtml(c.name || '')}</div>
            </div>
          </button>
        </div>
        <div class="float-bar fb-right">
          <button class="fb-expand${inputExpanded?' active':''}" onclick="app.toggleInputExpanded()" title="${inputExpanded?'折叠输入':'展开输入'}"><i class="ph ${inputExpanded?'ph-caret-down':'ph-note-pencil'} icon"></i></button>
          <button class="fb-submit" onclick="app.openSubmitMenu()" title="提交反馈${pendingCount?' ('+pendingCount+' 未答)':''}"><i class="ph ph-paper-plane-tilt icon"></i></button>
        </div>
        ${submitMenu}
        ${callerMenu}`;

    /* topbar — 新增横向 caller 头像条 (row0)，可点击切换 caller */
    const callerStripItems = State.callers.map(ci => {
      const isActive = ci.id === c.id;
      const pending = State.sessions.filter(x => x.callerId === ci.id && x.status === 'pending').length;
      const dot = pending > 0 ? `<span class="cs-dot"></span>` : '';
      return `<div class="caller-strip-item${isActive?' active':''}" style="--cc:${ci.color}" onclick="app._switchToCaller('${ci.id}')" title="${escapeHtml(ci.alias||ci.name)}${pending?' ('+pending+' 待)':''}">
        ${identiconSvg(ci.alias||ci.id, ci.color, 24)}
        ${dot}
      </div>`;
    }).join("");

    const topbar = `
      <div class="topbar detail-topbar">
        <div class="detail-tb-row0">
          <button class="tb-btn" onclick="app.closeSession()" title="返回"><i class="ph ph-arrow-left icon"></i></button>
          <button class="detail-title-btn" onclick="app.toggleDetailDrawer()" title="查看本 caller 的所有 session">
            <span class="detail-session-title">${escapeHtml(s.requestName || 'Untitled')}</span>
          </button>
          <button class="tb-btn" onclick="app.toggleDetailDrawer()" title="菜单"><i class="ph ph-list icon"></i></button>
        </div>
      </div>
    `;

    document.getElementById("app").innerHTML = `
      <div class="session-view" style="--caller-color:${c.color||'var(--primary)'};--caller-rgb:${hexToRgbTriple(c.color)}">
      ${topbar}
      ${this._renderDetailDrawer()}
      <div class="session-scroll">
        ${summaryCard}
        ${qCards}
      </div>
      ${bottomBar}
      </div>
    `;
    this._observeBottomBar();
    // 测量 detail-topbar 实际高度，写入 --detail-topbar-h 供抽屉与内容 padding 使用
    const tb = document.querySelector('.detail-topbar');
    if(tb) document.body.style.setProperty('--detail-topbar-h', tb.offsetHeight + 'px');
    // 自适应高度：渲染完成后，对主反馈框做一次高度计算
    const ta = document.querySelector('.feedback-main');
    if(ta) this._autoSize(ta);
    // 问卷各 textarea 也做一次自适应高度（PC QuestionsForm 同款）
    document.querySelectorAll('.questions-input').forEach(el => {
      el.style.height = 'auto';
      el.style.height = Math.max(el.scrollHeight, 28) + 'px';
    });
    // 滚动到底部自动展开输入面板；离开底部自动折叠
    if(this._scrollListener){ window.removeEventListener('scroll', this._scrollListener); this._scrollListener = null; }
    if(State.current && State.current.status === 'pending'){
      this._scrollListener = () => {
        const dist = document.documentElement.scrollHeight - window.scrollY - window.innerHeight;
        if(!State.inputExpanded && dist < 10){
          State.inputExpanded = true;
          app._justAutoOpened = true;
          app._minDistSinceOpen = dist;
          setTimeout(() => { app._justAutoOpened = false; }, 600);
          app.renderDetail();
          // 等布局稳定后滚到底，使内容顶到面板上方而不遮挡
          requestAnimationFrame(() => {
            window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
          });
        } else if(State.inputExpanded){
          // 追踪最接近底部的位置（含平滑滚动期间）
          if(app._minDistSinceOpen != null && dist < app._minDistSinceOpen){
            app._minDistSinceOpen = dist;
          }
          // 仅自动打开的面板才做自动折叠，且保护期过后才生效
          if(!app._justAutoOpened && app._minDistSinceOpen != null && dist > app._minDistSinceOpen + 200){
            app._minDistSinceOpen = null;
            State.inputExpanded = false;
            app.renderDetail();
          }
        }
      };
      window.addEventListener('scroll', this._scrollListener, { passive: true });
    }
  },

  /** textarea 自适应高度（max 由 CSS 的 max-height 约束） */
  _autoSize(el){
    if(!el) return;
    el.style.height = 'auto';
    const max = 260;  // 与 CSS max-height 一致
    const h = Math.min(el.scrollHeight, max);
    el.style.height = h + 'px';
    el.style.overflowY = el.scrollHeight > max ? 'auto' : 'hidden';
  },

  /** 测量底栏高度（float-bar + 可选 expanded-input + readonly）并同步到 --bottombar-h */
  _observeBottomBar(){
    const fb = document.querySelector('.float-bar');
    const ex = document.querySelector('.expanded-input');
    const ro = document.querySelector('.readonly-status');
    const targets = [fb, ex, ro].filter(Boolean);
    if(this._bbRO){ this._bbRO.disconnect(); this._bbRO = null; }
    if(targets.length === 0){ document.body.style.removeProperty('--bottombar-h'); return; }
    const update = () => {
      let h = 0;
      if(ro) h = ro.offsetHeight;
      else {
        if(fb) h = Math.max(h, fb.offsetHeight + 24); // 12px 上下 margin
        if(ex) h += ex.offsetHeight;
      }
      document.body.style.setProperty('--bottombar-h', h + 'px');
    };
    try {
      this._bbRO = new ResizeObserver(update);
      targets.forEach(t => this._bbRO.observe(t));
    } catch(e){}
    update();
  },

  toggleInputExpanded(){
    State.inputExpanded = !State.inputExpanded;
    app._minDistSinceOpen = null; // 手动操作不触发自动折叠
    this.renderDetail();
  },
  openSubmitMenu(){
    State.submitMenuOpen = !State.submitMenuOpen;
    if(State.submitMenuOpen) State.callerMenuOpen = false;
    this.renderDetail();
  },
  closeSubmitMenu(){
    State.submitMenuOpen = false;
    this.renderDetail();
  },
  openCallerMenu(){
    State.callerMenuOpen = !State.callerMenuOpen;
    if(State.callerMenuOpen) State.submitMenuOpen = false;
    this.renderDetail();
  },
  closeCallerMenu(){
    State.callerMenuOpen = false;
    this.renderDetail();
  },
  pickCallerFromMenu(id){
    State.callerMenuOpen = false;
    this._switchToCaller(id);
  },
  /** text=null 直接发送；否则先 applyPrompt 再 submitFeedback */
  submitWith(text){
    State.submitMenuOpen = false;
    if(text){ this.applyPrompt(text); }
    this.renderDetail();
    this.submitFeedback();
  },

  /** 详情页抽屉：当前 caller 的全部 session 按时间分组（借鉴 PC 侧栏） */
  _renderDetailDrawer(){
    const s = State.current; if(!s) return '';
    const all = State.sessions
      .filter(x => x.callerId === s.callerId)
      .sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    // 时间分桶：today / yesterday / lastWeek / earlier
    const now = new Date();
    const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    const yesterdayStart = todayStart - 86400000;
    const weekAgoStart = todayStart - 7 * 86400000;
    const bucketOf = (iso) => {
      const t = new Date(iso).getTime();
      if(t >= todayStart) return 'today';
      if(t >= yesterdayStart) return 'yesterday';
      if(t >= weekAgoStart) return 'lastWeek';
      return 'earlier';
    };
    const groups = {
      today:     { label:'今天',      items: [] },
      yesterday: { label:'昨天',      items: [] },
      lastWeek:  { label:'最近一周',  items: [] },
      earlier:   { label:'更早',      items: [] },
    };
    all.forEach(x => groups[bucketOf(x.createdAt)].items.push(x));
    if(!State._drawerCollapsed) State._drawerCollapsed = { today:false, yesterday:false, lastWeek:false, earlier:true };
    const renderItem = (p) => {
      const isActive = p.id === s.id;
      const iconName = p.status === 'pending' ? 'ph-circle-dashed'
        : p.status === 'responded' ? 'ph-check-circle'
        : 'ph-x-circle';
      const hasImg = (p.images && p.images.length > 0);
      const hasLog = (typeof p.testLogText === 'string' && p.testLogText.trim().length > 0);
      const hasGit = !!p.gitAction;
      const attachIcons = [
        hasImg ? '<i class="ph ph-image"></i>' : '',
        hasLog ? '<i class="ph ph-file-text"></i>' : '',
        hasGit ? '<i class="ph ph-git-branch"></i>' : '',
      ].join('');
      const attachHtml = attachIcons ? `<span class="d-item-attach">${attachIcons}</span>` : '';
      return `<button class="d-item${isActive?' active':''}" onclick="app._switchToSession('${p.id}')" title="${escapeHtml(p.requestName||'Untitled')}">
        <div class="d-item-r1">
          <span class="d-item-icon ${p.status}"><i class="ph ${iconName}"></i></span>
          <span class="d-item-title${p.status==='responded'?' responded':''}">${escapeHtml(p.requestName||'Untitled')}</span>
        </div>
        <div class="d-item-r2">
          <span class="d-item-time">${relativeTime(p.createdAt)}</span>
          ${attachHtml}
        </div>
      </button>`;
    };
    const renderGroup = (key, g) => {
      if(g.items.length === 0) return '';
      return `<div class="d-group">
        <div class="d-group-header">
          <span>${g.label}</span>
          <span class="d-group-count">${g.items.length}</span>
        </div>
        ${g.items.map(renderItem).join('')}
      </div>`;
    };
    const listHtml = all.length === 0
      ? `<div class="empty" style="padding:20px 16px">此 caller 没有 session</div>`
      : ['today','yesterday','lastWeek','earlier'].map(k => renderGroup(k, groups[k])).join('');
    const open = State._detailDrawerOpen ? ' open' : '';
    return `
      <div class="detail-drawer-mask${open}" onclick="app.toggleDetailDrawer()"></div>
      <div class="detail-drawer${open}">
        <div class="detail-drawer-list">${listHtml}</div>
      </div>
    `;
  },

  /** 反馈问卷表单（复刻 PC SummaryPanel QuestionsForm） */
  _renderQuestionsForm(s, c, readonly){
    const qs = s.questions || [];
    if(qs.length === 0) return '';
    const alias = escapeHtml(c.alias || c.name || '');
    const avatar = identiconSvg(c.alias||c.name||'?', c.color, 20);
    const items = qs.map((q, i) => {
      const chips = (q.options && q.options.length) ? `
        <div class="questions-chips">
          ${q.options.map(opt=>{
            const active = (q.selectedOptions||[]).includes(opt);
            return `<button class="questions-chip${active?' active':''}" ${readonly?'disabled':''} onclick="app.toggleOption(${i}, ${JSON.stringify(opt).replace(/"/g,'&quot;')})">${escapeHtml(opt)}</button>`;
          }).join("")}
        </div>` : '';
      const placeholder = readonly ? '' : `请填写${escapeHtml(q.label)}…`;
      const ta = `<textarea class="questions-input" ${readonly?'readonly':''} rows="1" placeholder="${placeholder}" oninput="app._onQuestionInput(event, ${i})">${escapeHtml(q.answer||'')}</textarea>`;
      return `
        <div class="questions-item">
          <div class="questions-item-header">
            <span class="questions-row-num">${i+1}</span>
            <span class="questions-label">${escapeHtml(q.label)}</span>
            ${chips}
          </div>
          ${ta}
        </div>`;
    }).join("");
    return `
      <div class="questions-form" style="border-top-color:rgba(var(--caller-rgb,78,201,176),.27)">
        <div class="questions-form-header">
          ${avatar}
          <span class="qf-ask" style="color:${c.color}">${alias}</span>
          <span>向你提问：</span>
        </div>
        <div class="questions-list">${items}</div>
      </div>
    `;
  },

  /** 问题 textarea 输入：自适应高度 + 写回数据 */
  _onQuestionInput(e, idx){
    const el = e.currentTarget;
    el.style.height = 'auto';
    el.style.height = Math.max(el.scrollHeight, 28) + 'px';
    this.setAnswer(idx, el.value);
  },

  toggleDrawerGroup(key){
    if(!State._drawerCollapsed) State._drawerCollapsed = {};
    State._drawerCollapsed[key] = !State._drawerCollapsed[key];
    const s = State.current; if(!s) return;
    // 只重绘抽屉，避免整页 renderDetail 造成抖动
    const drawerEl = document.querySelector('.detail-drawer');
    const maskEl = document.querySelector('.detail-drawer-mask');
    if(!drawerEl || !maskEl) return;
    const wrapper = document.createElement('div');
    wrapper.innerHTML = this._renderDetailDrawer();
    const newMask = wrapper.querySelector('.detail-drawer-mask');
    const newDrawer = wrapper.querySelector('.detail-drawer');
    if(newMask && newDrawer){ maskEl.replaceWith(newMask); drawerEl.replaceWith(newDrawer); }
  },

  _switchToSession(id){
    State._detailDrawerOpen = false;
    this.openSession(id);
  },

  /** 点顶栏头像条的某个 caller → 打开该 caller 最新的 session（若无则回首页并筛选） */
  _switchToCaller(id){
    if(id === (State.current && State.current.callerId)) return;  // 已经是当前 caller
    const latest = State.sessions
      .filter(x => x.callerId === id)
      .sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt))[0];
    if(latest){
      State._detailDrawerOpen = false;
      this.openSession(latest.id);
    } else {
      this.filterByCaller(id);
    }
  },

  toggleDetailDrawer(){
    // 直接操作已存在的 DOM，保留 CSS transition 动画（类似答题卡的展开/收起）
    State._detailDrawerOpen = !State._detailDrawerOpen;
    const open = State._detailDrawerOpen;
    const mask = document.querySelector('.detail-drawer-mask');
    const drawer = document.querySelector('.detail-drawer');
    const chevron = document.querySelector('.detail-chevron');
    if(mask) mask.classList.toggle('open', open);
    if(drawer) drawer.classList.toggle('open', open);
    if(chevron) chevron.classList.toggle('open', open);
  },

  toggleOption(qIdx, opt){
    const q = State.current.questions[qIdx];
    if(!q.selectedOptions) q.selectedOptions = [];
    const i = q.selectedOptions.indexOf(opt);
    if(i >= 0) q.selectedOptions.splice(i, 1);
    else q.selectedOptions.push(opt);
    this._persistLocal();
    this.renderDetail();
  },
  setAnswer(qIdx, val){
    State.current.questions[qIdx].answer = val;
    this._persistLocal();
  },
  setFeedback(val){
    State.current.feedbackText = val;
    this._persistLocal();
  },
  setTestLog(val){
    State.current.testLogText = val;
    this._persistLocal();
  },
  setGitAction(t){
    if(t === 'none') State.current.gitAction = null;
    else {
      const cur = State.current.gitAction || {};
      State.current.gitAction = { type: t, branchName: cur.branchName || '' };
    }
    this._persistLocal();
    this.renderDetail();
  },
  setBranchName(v){
    if(!State.current.gitAction) State.current.gitAction = { type: 'create-branch', branchName: '' };
    State.current.gitAction.branchName = v;
    this._persistLocal();
  },

  toggleTestLog(){
    State._showTestLog = !State._showTestLog;
    this.renderDetail();
  },
  toggleGit(){
    State._showGit = !State._showGit;
    this.renderDetail();
  },
  toggleImages(){
    State._showImages = !State._showImages;
    /* 展开且无图 → 顺手打开选图；折叠时不动 */
    if(State._showImages && (!State.current?.images || !State.current.images.length)){
      this.renderDetail();
      setTimeout(()=>{ const inp = document.querySelector('.thumb-add input[type="file"]'); if(inp) inp.click(); }, 50);
      return;
    }
    this.renderDetail();
  },
  pickImages(ev){
    const files = Array.from(ev.target.files || []);
    if(!files.length) return;
    const s = State.current; if(!s) return;
    if(!s.images) s.images = [];
    let remaining = files.length;
    files.forEach(f=>{
      const r = new FileReader();
      r.onload = () => {
        s.images.push({ path: `local:${Date.now()}_${f.name}`, name: f.name, sizeKB: f.size/1024, dataUrl: r.result });
        remaining--;
        if(remaining === 0){ this._persistLocal(); this.renderDetail(); }
      };
      r.readAsDataURL(f);
    });
    ev.target.value = '';
  },
  removeImage(i){
    const s = State.current; if(!s || !s.images) return;
    s.images.splice(i, 1);
    this._persistLocal();
    this.renderDetail();
  },
  applyPrompt(content){
    const s = State.current; if(!s) return;
    const cur = (s.feedbackText||'').trim();
    s.feedbackText = cur ? (cur + "\n\n" + content) : content;
    this._persistLocal();
    this.renderDetail();
  },
  applyQuickAction(text){
    /* 与 PC 对齐：quick action 不改 feedbackText，提交时注入；
       但手机版没 submit pipeline 的 quickAction 字段 —— 简化为追加到 feedback */
    this.applyPrompt(text);
  },

  _persistLocal(){
    const s = State.current; if(!s) return;
    State.storage.localEdits[s.id] = {
      feedbackText: s.feedbackText,
      testLogText: s.testLogText,
      questions: s.questions,
      gitAction: s.gitAction,
      images: s.images,
    };
    saveStorage();
  },

  async cancelSession(){
    const ok = await showConfirm("确认取消这条 session？", "取消", "不");
    if(!ok) return;
    const s = State.current;
    s.status = "cancelled";
    // 同步回列表
    const list = State.sessions.find(x=>x.id===s.id);
    if(list) list.status = "cancelled";
    delete State.storage.localEdits[s.id];
    saveStorage();
    this.closeSession();
  },

  async submitFeedback(){
    const s = State.current;
    const unanswered = (s.questions||[]).filter(q => !(q.answer||'').trim() && !(q.selectedOptions||[]).length).length;
    if(unanswered > 0){
      const ok = await showConfirm(`还有 ${unanswered} 道题未回答，确认提交？`, "提交", "再看看");
      if(!ok) return;
    }
    s.status = "responded";
    const list = State.sessions.find(x=>x.id===s.id);
    if(list) Object.assign(list, s);
    delete State.storage.localEdits[s.id];
    saveStorage();
    await showConfirm("已提交！（本地 mock，未真正回流到 PC）", "好", "好");
    this.closeSession();
  },
};

/* ========= 启动 + 水平滑动导航 ========= */
window.addEventListener("DOMContentLoaded", ()=>{
  app.init();

  const scroller = document.getElementById('nav-scroll');
  const tabs = ['home','callers','settings'];
  let _scrollTimer = null;

  function onSnapSettle(){
    if(!document.body.classList.contains('nav-mode')) return;
    if(app._navAnimating) return;
    const w = scroller.offsetWidth;
    if(!w) return;
    const idx = Math.round(scroller.scrollLeft / w);
    if(idx === (State._navIdx ?? 0)) return;
    State._navIdx = idx;
    State._navTab = tabs[idx];
    app._updateTabbar(tabs[idx]);
    app._animateNav = true;
    if(tabs[idx]==='home') app.goHome();
    else if(tabs[idx]==='callers') app.showRecentCallers();
    else if(tabs[idx]==='settings') app.showSettings();
    app._animateNav = false;
  }

  if('onscrollend' in window){
    scroller.addEventListener('scrollend', onSnapSettle);
  } else {
    scroller.addEventListener('scroll', ()=>{
      clearTimeout(_scrollTimer);
      _scrollTimer = setTimeout(onSnapSettle, 120);
    }, {passive:true});
  }
});
</script>
