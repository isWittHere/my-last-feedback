<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>大疆行测 2026 · 在线题库</title>
<script>
/* Android WebView 不支持 env(safe-area-inset-*), 在 CSS 解析前同步注入真实 insets,
   覆盖首屏渲染早于原生 evaluateJavascript 的竞态; iOS/桌面浏览器走 :root 中的 env() fallback */
(function(){
  try{
    if(window.DJIBridge && typeof window.DJIBridge.getInsets === "function"){
      var p = String(window.DJIBridge.getInsets()).split(",");
      var s = document.documentElement.style;
      s.setProperty("--sat", (parseFloat(p[0])||0) + "px");
      s.setProperty("--sab", (parseFloat(p[1])||0) + "px");
      s.setProperty("--sal", (parseFloat(p[2])||0) + "px");
      s.setProperty("--sar", (parseFloat(p[3])||0) + "px");
    }
  }catch(e){}
})();
</script>
<style>
  :root{
    --primary:#1f2329; --primary-dark:#111; --success:#52c41a; --danger:#ff4d4f;
    --warn:#faad14;
    --bg:#ffffff; --card:#ffffff; --card-2:#f2f3f5;
    --text:#1f2329; --muted:#8a8f99; --border:#e5e7eb;
    --sel-bg:#e6f4ff; --sel-bg-2:#f0f6ff;
    --ok-bg:#f6ffed; --no-bg:#fff1f0; --warn-bg:#fffbe6;
    --hm-f1:#ccc; --hm-f2:#999; --hm-f3:#666; --hm-f4:#333;
    --shadow:none;
    --radius:10px;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --topbar-h: 52px;
    --bottombar-h: 64px;
    --fs-base: 15px;
    color-scheme: light;
  }
  [data-theme="dark"], :root[data-theme="dark"]{
    --primary:#ffffff; --primary-dark:#e5e5e5; --success:#22c55e; --danger:#f87171;
    --warn:#fbbf24;
    --bg:#000000; --card:#0a0a0a; --card-2:#1a1a1a;
    --text:#f5f5f5; --muted:#a1a1aa; --border:#2a2a2a;
    --sel-bg:rgba(255,255,255,0.10); --sel-bg-2:rgba(255,255,255,0.05);
    --ok-bg:rgba(34,197,94,0.12); --no-bg:rgba(248,113,113,0.12); --warn-bg:rgba(251,191,36,0.12);
    --hm-f1:#333; --hm-f2:#666; --hm-f3:#999; --hm-f4:#ccc;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]):not([data-theme="dark"]){
      --primary:#ffffff; --primary-dark:#e5e5e5; --success:#22c55e; --danger:#f87171;
      --warn:#fbbf24;
      --bg:#000000; --card:#0a0a0a; --card-2:#1a1a1a;
      --text:#f5f5f5; --muted:#a1a1aa; --border:#2a2a2a;
      --sel-bg:rgba(255,255,255,0.10); --sel-bg-2:rgba(255,255,255,0.05);
      --ok-bg:rgba(34,197,94,0.12); --no-bg:rgba(248,113,113,0.12); --warn-bg:rgba(251,191,36,0.12);
      --hm-f1:#333; --hm-f2:#666; --hm-f3:#999; --hm-f4:#ccc;
      color-scheme: dark;
    }
  }
  /* 深色模式: primary 为白色, btn-primary 需反色 */
  [data-theme="dark"] .btn-primary,
  [data-theme="dark"] .cat-chip.active,
  [data-theme="dark"] .q-jumper button.current{color:#000}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .btn-primary,
    :root:not([data-theme="light"]) .cat-chip.active,
    :root:not([data-theme="light"]) .q-jumper button.current{color:#000}
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html[data-fs="small"]{--fs-base:13px}
  html[data-fs="large"]{--fs-base:17px}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;font-size:var(--fs-base);line-height:1.6;overscroll-behavior-y:none}
  body{padding-left:var(--sal); padding-right:var(--sar)}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 16px;font-size:14px;background:transparent;color:inherit;transition:background .15s,border-color .15s,color .15s;touch-action:manipulation;min-height:44px}
  button:disabled{cursor:not-allowed;opacity:.4}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-ghost{background:var(--card-2);color:var(--text);border:1px solid var(--border)}
  .btn-success{background:var(--text);color:var(--bg)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-danger{background:var(--danger);color:#fff}
  @media (hover: hover){
    .btn-primary:hover:not(:disabled){background:var(--primary-dark)}
    .btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
  }

  .container{max-width:900px;margin:0 auto;padding:calc(var(--sat) + 12px) 16px 16px}
  /* 答题模式: 切换布局 */
  body.quiz-mode{padding-bottom:0}
  body.quiz-mode .container{max-width:none;padding:0;margin:0}

  /* #app 子页面 (picker/setup/result) 在原生 toolbar 下方 */
  body:not(.quiz-mode) #app{padding-top:var(--sat)}

  /* 导航三页顶部标题条 (子页面使用) */
  .page-head{padding:10px 16px;display:flex;align-items:center;gap:8px;min-height:44px}
  /* Android 原生顶栏接管时, 隐藏 HTML 版 page-head */
  body.native-toolbar .page-head{display:none!important}
  body.native-toolbar .page-head + *{border-top:none!important}
  .page-head h1{margin:0;font-size:17px;font-weight:600;color:var(--text);flex:1;line-height:1.3}
  .page-head .meta{font-size:12px;color:var(--muted)}
  .page-head .tb-btn{margin-left:-8px}

  /* 顶栏 (答题页) */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--card);border-bottom:1px solid var(--border);padding-top:var(--sat);padding-left:calc(8px + var(--sal));padding-right:calc(8px + var(--sar));display:flex;align-items:center;gap:8px;height:calc(var(--topbar-h) + var(--sat))}
  .quiz-pbar{position:absolute;bottom:-3px;left:0;right:0;height:3px;display:flex;z-index:1;transition:height .2s,bottom .2s}
  .quiz-pbar.expanded{height:6px;bottom:-6px}
  .quiz-pbar span{flex:1;min-width:0}
  .tb-btn{background:transparent;border:none;padding:8px;min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;color:var(--text);border-radius:50%;font-size:14px;flex-shrink:0}
  .tb-btn .icon{width:22px;height:22px}
  @media (hover: hover){ .tb-btn:hover{background:var(--card-2)} }
  .tb-btn:active{background:var(--border)}
  .tb-title{display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:4px 12px;border-radius:999px;min-width:0;background:var(--card-2)}
  .tb-title:active{background:var(--card-2)}
  .tb-title .t1{font-size:14px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px;line-height:1.2}
  .tb-title .t1 .icon{width:14px;height:14px;color:var(--muted);transition:transform .2s}
  .tb-title.open .t1 .icon{transform:rotate(180deg)}
  .tb-title .t2{font-size:11px;color:var(--muted);line-height:1.2;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .tb-label{font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;margin-left:4px}
  .tb-timer{font-variant-numeric:tabular-nums;font-weight:600;color:var(--warn);font-size:13px;padding:4px 8px;border-radius:6px;background:var(--warn-bg);flex-shrink:0}
  .study-cat-select{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:1}
  .study-dd{position:relative;display:inline-flex;align-items:center}
  .study-dd-btn{display:flex;align-items:center;gap:4px;padding:6px 8px;background:none;border:none;border-radius:999px;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
  .study-dd-btn .icon{width:14px;height:14px;color:var(--muted);transition:transform .2s}
  .study-dd.open .study-dd-btn .icon{transform:rotate(180deg)}
  .study-dd-menu{display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px;z-index:30;min-width:140px}
  .study-dd.open .study-dd-menu{display:block}
  .study-dd-item{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:8px;font-size:14px;color:var(--text);cursor:pointer;white-space:nowrap}
  .study-dd-item:active{background:var(--card-2)}
  .study-dd-item.active{color:var(--accent);font-weight:600}
  .study-dd-item .dd-count{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}
  .tb-timer.urgent{color:#fff;background:var(--danger);animation:blink 1s infinite}

  /* 抽屉 */
  .drawer-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:19;opacity:0;pointer-events:none;transition:opacity .2s}
  .drawer-mask.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:calc(var(--topbar-h) + var(--sat));left:0;right:0;z-index:19;background:var(--card);border-bottom:1px solid var(--border);transform:translateY(-100%);transition:transform .25s ease;max-height:66vh;display:flex;flex-direction:column;overflow:hidden;padding:0}
  .drawer.open{transform:translateY(0)}
  .drawer-section + .drawer-section{margin-top:10px}
  .drawer-top{flex-shrink:0;padding:14px 16px 12px}
  .drawer-grid-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;padding:4px 16px 12px;border-top:1px solid var(--border)}
  .drawer .mode-name{font-size:14px;font-weight:600;color:var(--text)}
  .drawer .progress-text{font-size:12px;color:var(--muted)}
  .drawer-title{font-size:11px;color:var(--muted);letter-spacing:.3px;margin-bottom:6px;font-weight:500}
  .mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .mini-stat{text-align:center;padding:4px 0}
  .mini-stat .num{font-size:18px;font-weight:600;line-height:1.15}
  .mini-stat .label{font-size:11px;color:var(--muted);margin-top:2px}
  .mini-stat.ok .num{color:var(--success)}
  .mini-stat.no .num{color:var(--danger)}
  .mini-stat.skip .num{color:var(--warn)}
  .mini-stat.mark .num{color:var(--warn)}
  .exam-locked{background:var(--warn-bg);border-radius:8px;padding:10px 12px;font-size:13px}
  .progress{background:var(--card-2);height:6px;border-radius:3px;overflow:hidden;position:relative}
  .progress-inner{height:100%;background:var(--primary);transition:width .3s}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:6px}
  .legend span{display:inline-flex;align-items:center;gap:4px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px}

  /* 主滚动区 */
  .quiz-scroll{padding:calc(var(--topbar-h) + var(--sat) + 12px) 16px calc(var(--bottombar-h) + var(--sab) + 16px)}
  .quiz-scroll > *{max-width:900px;margin-left:auto;margin-right:auto}

  /* 底栏 */
  .bottombar{position:fixed;left:50%;bottom:calc(12px + var(--sab));transform:translateX(-50%);z-index:20;background:rgba(255,255,255,.45);-webkit-backdrop-filter:saturate(150%) blur(10px);backdrop-filter:saturate(150%) blur(10px);border:1px solid var(--border);padding:5px;display:flex;gap:8px;align-items:stretch;border-radius:999px}
  [data-theme="dark"] .bottombar{background:rgba(26,26,26,.45)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bottombar{background:rgba(26,26,26,.45)}}
  .bottombar button{font-size:13px;font-weight:500;border-radius:999px;padding:8px 16px;white-space:nowrap;min-height:0}

  /* === 自定义确认弹窗 === */
  .modal-mask{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
  .modal-mask.open{opacity:1;pointer-events:auto}
  .modal-sheet{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:420px;padding:20px 20px calc(20px + var(--sab));transform:translateY(100%);transition:transform .25s ease-out}
  .modal-mask.open .modal-sheet{transform:translateY(0)}
  .modal-msg{font-size:15px;line-height:1.6;margin-bottom:16px;color:var(--text);text-align:center}
  .modal-actions{display:flex;gap:10px}
  .modal-actions button{flex:1;height:44px;border:none;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer}
  .modal-actions .modal-cancel{background:var(--card-2);color:var(--text)}
  .modal-actions .modal-ok{background:var(--danger);color:#fff}

  /* === 导航页: 贯穿分割线风格 === */
  /* 容器去掉左右 padding, 让分割线一直到屏幕边缘 */
  body.nav-mode .container, body:not(.quiz-mode) .container{padding-left:0;padding-right:0;padding-top:var(--sat);max-width:none}
  /* section: 全宽板块, 顶部一根贯穿线 */
  .section{padding:14px 16px;border-top:1px solid var(--border)}
  .section:first-child{border-top:none}
  .section-title{font-size:12px;color:var(--muted);margin:0 0 8px;font-weight:500;letter-spacing:.2px}
  .section-title.inline{display:flex;justify-content:space-between;align-items:center}
  .section-title.inline .right{font-size:12px;color:var(--muted);font-weight:400}
  /* 兼容旧 .stats-card 调用: 等同 section */
  .stats-card{background:var(--card);padding:14px 16px;border-top:1px solid var(--border)}
  .stats-card:first-child{border-top:none}

  /* 首页统计一行紧凑排列 */
  .stats-row{display:flex;align-items:stretch;gap:12px}
  .stats-row .stat-cell{flex:1;text-align:center;padding:4px 0;min-width:0}
  .stats-row .stat-cell .num{font-size:20px;font-weight:600;color:var(--text);line-height:1.15}
  .stats-row .stat-cell .label{font-size:11px;color:var(--muted);margin-top:2px}

  .heatmap{display:flex;flex-wrap:wrap;gap:3px;margin-top:10px}
  .heatmap .hm-cell{width:10px;height:10px;border-radius:2px;background:var(--card-2)}
  .heatmap .hm-cell.lv1{background:#ef4444;opacity:.55}
  .heatmap .hm-cell.lv2{background:#ef4444}
  .heatmap .hm-cell.lv3{background:#eab308}
  .heatmap .hm-cell.lv4{background:#22c55e}
  .heatmap .hm-cell.f1{background:var(--hm-f1)}
  .heatmap .hm-cell.f2{background:var(--hm-f2)}
  .heatmap .hm-cell.f3{background:var(--hm-f3)}
  .heatmap .hm-cell.f4{background:var(--hm-f4)}
  .heatmap-legend{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:11px;color:var(--muted)}
  .heatmap-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:3px;vertical-align:middle}

  /* 首页模式: 列表式 (不再是卡片网格) */
  .mode-list .mode-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--border);background:var(--card);cursor:pointer;touch-action:manipulation;color:var(--text)}
  .mode-list .mode-row:first-child{border-top:none}
  @media (hover: hover){ .mode-list .mode-row:hover{background:var(--card-2)} }
  .mode-list .mode-row:active{background:var(--card-2)}
  .mode-list .m-icon{width:36px;height:36px;border-radius:8px;background:var(--sel-bg-2);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .mode-list .m-icon .icon{width:20px;height:20px}
  .mode-list .m-text{flex:1;min-width:0}
  .mode-list .m-title{font-size:15px;font-weight:500;color:var(--text);line-height:1.25}
  .mode-list .m-desc{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
  .mode-list .m-arrow{color:var(--muted);font-size:18px;flex-shrink:0}

  /* 保留旧 home-grid 用于 picker 页面 */
  .home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--border);margin-top:0}
  .home-grid .mode-card{background:var(--card);border-radius:0;padding:14px 16px;cursor:pointer;transition:background .15s;text-align:left;touch-action:manipulation;border:none}
  @media (hover: hover){ .home-grid .mode-card:hover{background:var(--card-2)} }
  .home-grid .mode-card:active{background:var(--sel-bg-2)}
  .home-grid .mode-card h3{margin:0 0 4px;color:var(--text);font-size:15px;font-weight:500;display:flex;align-items:center;gap:6px}
  .home-grid .mode-card h3 .icon{color:var(--text);width:18px;height:18px}
  .home-grid .mode-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}

  /* 简单网格数字条 (考试配置) */
  .stats-grid{display:flex;align-items:stretch;gap:0}
  .stats-grid .stat-item{flex:1;text-align:center;padding:4px 0;border-left:1px solid var(--border)}
  .stats-grid .stat-item:first-child{border-left:none}
  .stat-item .num{font-size:18px;font-weight:600;color:var(--text);line-height:1.2}
  .stat-item .label{font-size:11px;color:var(--muted);margin-top:2px}

  .category-list{display:flex;flex-wrap:wrap;gap:8px}
  .cat-chip{padding:6px 12px;background:var(--card-2);border-radius:16px;cursor:pointer;font-size:13px;min-height:32px;display:inline-flex;align-items:center;touch-action:manipulation;color:var(--text);border:1px solid transparent}
  .cat-chip.active{background:var(--primary);color:#fff}
  @media (hover: hover){ .cat-chip:hover:not(.active){border-color:var(--primary);color:var(--primary)} }

  /* 分类/模式: 圆角矩形按钮网格 */
  .btn-grid{display:grid;gap:10px}
  .btn-grid.cols-3{grid-template-columns:repeat(3,1fr)}
  .btn-grid.cols-2{grid-template-columns:repeat(2,1fr)}
  .btn-grid.cols-4{grid-template-columns:repeat(4,1fr)}
  .btn-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 8px;background:var(--card-2);border:1px solid var(--border);border-radius:10px;color:var(--text);cursor:pointer;touch-action:manipulation;min-height:72px;text-align:center}
  .btn-tile:active{background:var(--sel-bg-2)}
  @media (hover: hover){ .btn-tile:hover{border-color:var(--primary);color:var(--primary)} }
  .btn-tile .icon{width:22px;height:22px;color:var(--text)}
  .btn-tile .t-title{font-size:13px;font-weight:500;line-height:1.2}
  .btn-tile .t-sub{font-size:11px;color:var(--muted);line-height:1.2}
  .btn-tile.mode{flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;padding:14px 16px;text-align:left}
  .btn-tile.mode .icon{width:28px;height:28px;flex-shrink:0}
  .btn-tile.mode .t-title{font-size:14px}
  .btn-tile.mode .t-sub{margin-top:2px}
  .btn-tile.cat{min-height:52px;padding:10px 8px}
  .btn-tile.cat .t-title{font-size:13px}
  .btn-tile.cat .t-sub{font-size:11px;color:var(--muted);margin-top:2px}

  /* 横向列表按钮: 错题列表 / picker 分类项 / 设置危险操作 */
  .tile-btn{display:flex;align-items:center;gap:10px;width:100%;padding:8px 0;background:none;border:none;border-radius:0;color:var(--text);text-align:left;cursor:pointer;touch-action:manipulation;font:inherit;min-height:44px}
  .tile-btn:active{background:var(--sel-bg-2)}
  @media (hover: hover){ .tile-btn:hover{background:var(--sel-bg-2)} }
  .tile-btn .tb-icon{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted)}
  .tile-btn .tb-icon .icon{width:20px;height:20px}
  .tile-btn.danger .tb-icon{color:var(--danger)}
  .tile-btn.danger{color:var(--danger);background:var(--card-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
  .tile-btn .tb-body{flex:1;min-width:0;text-align:left}
  .tile-btn .tb-title{display:block;text-align:left;font-size:14px;font-weight:500;line-height:1.25;overflow:hidden;text-overflow:ellipsis;color:var(--text);padding:0;border-radius:0;background:none}
  .tile-btn .tb-sub{display:block;text-align:left;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;-webkit-line-clamp:1;-webkit-box-orient:vertical}
  .tile-btn .tb-right{color:var(--muted);font-size:18px;flex-shrink:0}
  .tile-list{display:flex;flex-direction:column;gap:2px}

  /* 设置页 -- 列表式 */
  .list-group{margin-bottom:0;border-top:1px solid var(--border)}
  .list-group:first-child{border-top:none}
  .list-group + .list-group{margin-top:16px;border-top:1px solid var(--border)}
  .list-item{display:flex;align-items:center;padding:13px 16px;gap:12px;border-top:1px solid var(--border);min-height:44px}
  .list-group .list-item:first-child{border-top:none}
  .list-item .l-label{flex:1;font-size:15px;color:var(--text)}
  .list-item .l-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .list-item .l-right{color:var(--muted);font-size:14px}
  .seg{display:inline-flex;background:var(--card-2);border-radius:8px;padding:2px;gap:0}
  .seg button{padding:5px 10px;font-size:12px;min-height:28px;border-radius:6px;background:transparent;color:var(--muted)}
  .seg-sm button{padding:3px 7px;font-size:11px;min-height:24px}
  .seg button.active{background:var(--card);color:var(--primary);font-weight:600}
  [data-theme="dark"] .seg button.active, :root[data-theme="dark"] .seg button.active{background:var(--border);color:var(--primary)}

  /* 题卡 */
  .question-card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px}
  .q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
  .q-num{font-weight:600;color:var(--primary);font-size:14px}
  .q-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tag{padding:2px 10px;border-radius:12px;font-size:12px;background:var(--card-2);color:var(--muted)}
  .q-stem{font-size:var(--fs-base);white-space:pre-wrap;word-break:break-word;color:var(--text)}
  .q-images{margin:10px 0;display:flex;flex-wrap:wrap;gap:8px}
  .q-images img{max-width:100%;border-radius:6px;background:#fafafa;touch-action:pinch-zoom}
  [data-theme="dark"] .q-images img{filter:invert(1) hue-rotate(180deg);background:transparent}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .q-images img{filter:invert(1) hue-rotate(180deg);background:transparent}
  }
  .q-table{margin:10px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .q-table table{border-collapse:collapse;width:100%;font-size:var(--fs-base);color:var(--text)}
  .q-table th,.q-table td{border:1px solid var(--border);padding:8px 10px;text-align:center;vertical-align:middle}
  .q-table th{background:var(--card-2);font-weight:600}
  .q-table td:first-child{font-weight:600;white-space:nowrap}

  .options{list-style:none;padding:0;margin:12px 0 0}
  .option{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:background .15s,border-color .15s;user-select:none;touch-action:manipulation;min-height:44px;background:var(--card)}
  @media (hover: hover){ .option:hover:not(.disabled){border-color:var(--primary);background:var(--sel-bg-2)} }
  .option:active:not(.disabled){background:var(--sel-bg)}
  .option.selected{border-color:var(--primary);background:var(--sel-bg)}
  .option.correct{border-color:var(--success);background:var(--ok-bg)}
  .option.wrong{border-color:var(--danger);background:var(--no-bg)}
  .option.disabled{cursor:default}
  .option .letter{font-weight:600;color:var(--primary);min-width:20px;font-size:var(--fs-base)}
  .option .text{font-size:var(--fs-base);flex:1;color:var(--text)}
  .option.correct .letter,.option.correct .text{color:var(--success)}
  .option.wrong .letter,.option.wrong .text{color:var(--danger)}

  .feedback{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:var(--fs-base)}
  .feedback.ok{background:var(--ok-bg)}
  .feedback.no{background:var(--no-bg)}
  .explanation{margin-top:6px;padding:8px 12px;background:var(--card-2);border-radius:8px;font-size:var(--fs-base);white-space:pre-wrap;color:var(--text);line-height:1.6;opacity:.95}
  .explanation .ex-label{display:block;font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.3px;margin-bottom:4px}
  .explanation .ex-body{display:block}
  .study-reveal-btn{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;padding:10px 16px;width:100%;background:var(--card-2);border:1px dashed var(--border);border-radius:8px;color:var(--muted);font-size:14px;cursor:pointer;transition:background .15s}
  .study-reveal-btn .icon{width:18px;height:18px}
  .study-reveal-btn:hover{background:var(--card)}
  .study-reveal-content{display:none;margin-top:0}
  .study-reveal-content.open{display:block}
  .toggle-sw{width:44px;height:26px;border-radius:13px;background:var(--border);position:relative;transition:background .2s;flex-shrink:0;cursor:pointer}
  .toggle-sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .toggle-sw.on{background:var(--success)}
  .toggle-sw.on::after{transform:translateX(18px)}

  /* 结果页 */
  .result-card{background:var(--card);padding:24px 16px;text-align:center;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  .score-big{font-size:48px;font-weight:700;color:var(--primary);line-height:1.2}
  .score-label{color:var(--muted);margin-bottom:16px;font-size:13px}
  .review-list{margin-top:0}
  .review-list h3{font-size:12px;font-weight:500;margin:16px 16px 6px;color:var(--muted);letter-spacing:.2px}
  .review-item{padding:11px 16px;margin-bottom:0;display:flex;gap:10px;align-items:flex-start;cursor:pointer;background:var(--card);border-top:1px solid var(--border)}
  .review-item:first-of-type{border-top:1px solid var(--border)}
  @media (hover: hover){ .review-item:hover{background:var(--card-2)} }
  .review-item .mark{font-weight:600;min-width:22px}
  .review-item .mark.ok{color:var(--success)}
  .review-item .mark.no{color:var(--danger)}
  .review-item .mark.skip{color:var(--warn)}

  /* 题号导航 */
  .q-jumper{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:5px;margin-top:2px}
  .q-jumper button{width:100%;aspect-ratio:1;padding:0;font-size:13px;background:var(--card-2);color:var(--text);border:1px solid transparent;border-radius:6px;min-height:40px}
  .q-jumper button.current{border-color:var(--primary);background:var(--primary);color:#fff;font-weight:600}
  .q-jumper button.answered{background:var(--sel-bg);color:var(--primary)}
  .q-jumper button.correct{background:var(--ok-bg);color:var(--success)}
  .q-jumper button.wrong{background:var(--no-bg);color:var(--danger)}
  .q-jumper button.marked{outline:2px solid var(--warn);outline-offset:-2px}

  .hidden{display:none!important}
  .loading{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty{text-align:center;padding:40px 20px;color:var(--muted)}
  @keyframes blink{50%{opacity:.5}}

  /* 底部 Tab 导航 */
  .tabbar{position:fixed;left:50%;bottom:calc(12px + var(--sab));transform:translateX(-50%);z-index:15;display:flex;gap:8px;padding:5px;background:rgba(255,255,255,.45);-webkit-backdrop-filter:saturate(150%) blur(10px);backdrop-filter:saturate(150%) blur(10px);border:1px solid var(--border);border-radius:999px}
  [data-theme="dark"] .tabbar{background:rgba(26,26,26,.45)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabbar{background:rgba(26,26,26,.45)}}
  .tabbar button{background:transparent;border:none;padding:8px 16px;color:var(--muted);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;border-radius:999px;transition:all .15s;min-height:0;white-space:nowrap}
  .tabbar button .icon{width:20px;height:20px}
  .tabbar button.active{background:var(--text);color:var(--bg)}
  .tabbar button:active{opacity:.7}

  body.nav-mode{padding:0;margin:0;overflow:hidden}
  body.nav-mode .container{display:flex;flex-direction:column;position:fixed;inset:0;padding:var(--sat) 0 0;max-width:none;overflow:hidden}
  #nav-pager{position:fixed;top:var(--sat);left:0;right:0;bottom:0}
  #nav-scroll{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:none}
  #nav-scroll::-webkit-scrollbar{display:none}
  .panel{flex:0 0 100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:none;scroll-snap-align:start;scroll-snap-stop:always;padding-bottom:calc(56px + var(--sab))}
  .panel>.section:first-child{border-top:none}
  .notebook-sticky{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border)}

  /* 小屏精调 */
  @media (max-width:640px){
    .mini-stats{grid-template-columns:repeat(4,1fr)}
    .home-grid{grid-template-columns:1fr}
    .question-card{padding:14px}
    .score-big{font-size:40px}
    .page-head h1{font-size:20px}
  }

  .icon{width:1em;height:1em;vertical-align:-.125em;fill:currentColor;stroke:none;flex-shrink:0}
  .mode-card h3 .icon{width:1.25em;height:1.25em;margin-right:.35em;color:var(--text)}
  .feedback .icon{width:1.1em;height:1.1em;margin-right:.35em}
  .empty .icon{width:1.3em;height:1.3em;margin-right:.3em;color:var(--success)}
</style>

<div class="container">
  <div id="loading" class="loading">正在加载题库…</div>
  <div id="nav-pager" class="hidden">
    <div id="nav-scroll">
      <div id="panel-home" class="panel"></div>
      <div id="panel-notebook" class="panel"></div>
      <div id="panel-settings" class="panel"></div>
    </div>

  <nav id="main-tabbar" class="tabbar hidden"></nav>

<script>
/* ========= 数据层 ========= */
const STORAGE_KEY = "dji_quiz_v1";

const State = {
  questions: [],
  meta: null,
  session: null,
  storage: null,
  currentPage: "home", // home|wrong|settings|picker-cat|picker-study|exam-setup|quiz|result
};

function loadStorage(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const o = JSON.parse(raw);
      if(!o.settings) o.settings = { theme: "auto" };
      return o;
    }
  }catch(e){}
  return { records:{}, wrongBook:[], history:[], marks:{}, settings:{ theme:"auto" }, studyAnswers:{} };
}
function saveStorage(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(State.storage)); }catch(e){}
}

/* 记录某题答题结果
 * rec.streak: 当前连续正确次数 (答错归零)
 * 错题本规则: 一旦答错 -> 加入错题本; 只有连续答对 3 次才移除 (streak >= 3)
 */
function recordAnswer(qid, selected, correct){
  const rec = State.storage.records[qid] || { attempts:0, correct:0, wrong:0, streak:0, last:null };
  rec.attempts++;
  if(correct){ rec.correct++; rec.streak = (rec.streak||0) + 1; }
  else { rec.wrong++; rec.streak = 0; }
  rec.last = { selected, correct, time: Date.now() };
  State.storage.records[qid] = rec;

  // 错题本管理: 一旦错过 -> 记录到 everWrong + 加入错题本; 连续对 3 次才移除
  State.storage.everWrong = State.storage.everWrong || {};
  const wrongSet = new Set(State.storage.wrongBook);
  if(!correct){
    wrongSet.add(qid);
    State.storage.everWrong[qid] = (State.storage.everWrong[qid] || 0) + 1;
  }else if(wrongSet.has(qid) && rec.streak >= 3){
    wrongSet.delete(qid);
  }
  State.storage.wrongBook = [...wrongSet];
  saveStorage();
}

/* ========= 工具 ========= */
function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function catIconRef(name){
  const map = {
    "言语理解":"#i-cat-verbal",
    "数量关系":"#i-cat-math",
    "图形推理":"#i-cat-shape",
    "逻辑判断":"#i-cat-logic",
  };
  return map[name] || "#i-folder";
}
function formatTime(sec){
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec/60);
  const s = sec%60;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

/* ========= 自定义确认弹窗 ========= */
function showConfirm(msg, okText, cancelText){
  return new Promise(resolve=>{
    let mask = document.getElementById('modal-confirm');
    if(!mask){
      mask = document.createElement('div');
      mask.id = 'modal-confirm';
      mask.className = 'modal-mask';
      document.body.appendChild(mask);
    }
    mask.innerHTML = `<div class="modal-sheet">
      <div class="modal-msg">${escapeHtml(msg)}</div>
      <div class="modal-actions">
        <button class="modal-cancel" id="modal-no">${escapeHtml(cancelText||'取消')}</button>
        <button class="modal-ok" id="modal-yes">${escapeHtml(okText||'确定')}</button>
      </div>
    </div>`;
    requestAnimationFrame(()=> mask.classList.add('open'));
    const close = (val)=>{ mask.classList.remove('open'); setTimeout(()=>{ mask.innerHTML=''; }, 250); resolve(val); };
    mask.querySelector('#modal-yes').onclick = ()=> close(true);
    mask.querySelector('#modal-no').onclick = ()=> close(false);
    mask.onclick = (e)=>{ if(e.target === mask) close(false); };
  });
}

/* ========= 应用 ========= */
const app = {
  async init(){
    State.storage = loadStorage();
    this.applyTheme();
    this.applyFontSize();
    try{
      const [resp, ptResp] = await Promise.all([
        fetch("questions.json", { cache:"no-cache" }),
        fetch("personality_test.json", { cache:"no-cache" }).catch(()=>null)
      ]);
      if(!resp.ok) throw new Error("HTTP "+resp.status);
      const data = await resp.json();
      State.questions = data.questions;
      State.meta = data.meta;
      if(ptResp && ptResp.ok){
        const ptData = await ptResp.json();
        State.ptQuestions = ptData.questions;
        State.ptMeta = ptData.meta;
      }
    }catch(err){
      document.getElementById("loading").innerHTML =
        `<div style="color:var(--danger)">题库加载失败: ${escapeHtml(err.message)}<br><br>
        如果你是双击打开此 HTML 文件，请改用本地服务器：<br>
        <code>python -m http.server 8000</code> 然后访问 <code>http://localhost:8000</code></div>`;
      return;
    }
    document.getElementById("loading").classList.add("hidden");
    this.updateWrongCount();
    this.goHome();
  },

  applyTheme(){
    const t = (State.storage.settings && State.storage.settings.theme) || "auto";
    const root = document.documentElement;
    if(t === "auto") root.removeAttribute("data-theme");
    else root.setAttribute("data-theme", t);
    // 通知原生宿主, 调整状态栏前景色 (可选)
    try{
      if(window.DJIBridge && typeof window.DJIBridge.setTheme === "function"){
        const isDark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
        window.DJIBridge.setTheme(isDark ? "dark" : "light");
      }
    }catch(e){}
  },

  setTheme(t){
    State.storage.settings = State.storage.settings || {};
    State.storage.settings.theme = t;
    saveStorage();
    this.applyTheme();
    if(State.currentPage === "settings") this.showSettings();
  },
  toggleStudySetting(){
    State.storage.settings = State.storage.settings || {};
    State.storage.settings.studyShowAnswer = !State.storage.settings.studyShowAnswer;
    saveStorage();
    this.showSettings();
  },
  setFontSize(v){
    State.storage.settings = State.storage.settings || {};
    State.storage.settings.fontSize = v;
    saveStorage();
    this.applyFontSize();
    if(State.currentPage === "settings") this.showSettings();
  },
  applyFontSize(){
    const fs = (State.storage.settings && State.storage.settings.fontSize) || "medium";
    if(fs === "medium") document.documentElement.removeAttribute('data-fs');
    else document.documentElement.setAttribute('data-fs', fs);
  },

  updateWrongCount(){
    const el = document.getElementById("wrongCount");
    const c = State.storage.wrongBook.length;
    if(el) el.textContent = c ? `(${c})` : "";
  },

  setTitle(title){
    // 顶部通栏已移除, 标题改由各页面 page-head 渲染, 此方法保留为 no-op 兼容调用点
    State.pageTitle = title;
  },

  enterNavMode(){
    document.body.classList.add("nav-mode");
    document.body.classList.remove("quiz-mode");
    this.closeDrawer();
    document.getElementById("nav-pager").classList.remove("hidden");
    document.getElementById("main-tabbar").classList.remove("hidden");
    document.getElementById("app").classList.add("hidden");
  },

  exitNavMode(){
    document.body.classList.remove("nav-mode");
    document.getElementById("nav-pager").classList.add("hidden");
    document.getElementById("main-tabbar").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
  },

  /** 控制 Android 原生顶栏: title=false → 隐藏, 否则显示指定标题 */
  _syncNativeToolbar(title, showBack){
    if(!window.DJIBridge || !DJIBridge.showToolbar) return;
    if(title === false){
      document.documentElement.style.setProperty('--sat', '0px');
      DJIBridge.hideToolbar();
      document.body.classList.remove('native-toolbar');
    } else {
      const h = DJIBridge.getToolbarHeight ? DJIBridge.getToolbarHeight() : 0;
      document.documentElement.style.setProperty('--sat', h + 'px');
      DJIBridge.showToolbar(String(title), showBack ? 'true' : 'false');
      document.body.classList.add('native-toolbar');
    }
  },

  tabbarHtml(active){
    const mk = (id, label, icon) =>
      `<button class="${active===id?'active':''}" onclick="app.navTab('${id}')">
         <svg class="icon"><use href="#${icon}"/></svg><span>${label}</span>
       </button>`;
    const wrongCnt = State.storage.wrongBook.length;
    const favCnt = Object.keys(State.storage.marks || {}).length;
    return `<nav class="tabbar">
      ${mk('home','首页','i-home')}
      ${mk('notebook','笔记本','i-book')}
      ${mk('settings','设置','i-menu')}
    </nav>`;
  },

  _updateTabbar(active){
    const mk = (id, label, icon) =>
      `<button class="${active===id?'active':''}" onclick="app.navTab('${id}')">
         <svg class="icon"><use href="#${icon}"/></svg><span>${label}</span>
       </button>`;
    document.getElementById("main-tabbar").innerHTML =
      mk('home','首页','i-home') +
      mk('notebook','笔记本','i-book') +
      mk('settings','设置','i-menu');
  },

  _navAnimating: false,
  _setNavPage(idx, animate){
    const scroller = document.getElementById('nav-scroll');
    State._navIdx = idx;
    const target = idx * scroller.offsetWidth;
    if(!animate){
      this._navAnimating = true;
      scroller.scrollTo({left: target, behavior:'instant'});
      requestAnimationFrame(()=>{ this._navAnimating = false; });
      return;
    }
    // Fast 200ms ease-out animation — disable snap during animation
    const start = scroller.scrollLeft;
    const dist = target - start;
    if(!dist) return;
    this._navAnimating = true;
    scroller.style.scrollSnapType = 'none';
    const dur = 200;
    const t0 = performance.now();
    const step = (now) => {
      const p = Math.min((now - t0) / dur, 1);
      const ease = 1 - Math.pow(1 - p, 3); // ease-out cubic
      scroller.scrollLeft = start + dist * ease;
      if(p < 1) requestAnimationFrame(step);
      else {
        scroller.style.scrollSnapType = '';
        this._navAnimating = false;
      }
    };
    requestAnimationFrame(step);
  },

  _animateNav: false,

  /** 原生 Toolbar 段选器回调 (Kotlin evaluateJavascript → JS) */
  _onNativeTab(id){
    if(State.currentPage === 'home'){
      this.switchHomeTab(id);
    } else {
      this.showNotebookPage(id);
    }
  },

  navTab(tab){
    const tabs = ['home','notebook','settings'];
    const newIdx = tabs.indexOf(tab);
    const oldIdx = State._navIdx ?? 0;
    if(newIdx === oldIdx) return;
    // Render target panel content first
    this._animateNav = true;
    if(tab === 'home') this.goHome();
    else if(tab === 'notebook') this.showNotebookPage();
    else if(tab === 'settings') this.showSettings();
    this._animateNav = false;
    // Scroll to page
    this._setNavPage(newIdx, true);
  },

  goHome(tab){
    if(!tab) tab = State._homeTab || 'quiz';
    State._homeTab = tab;
    State.session = null;
    State.currentPage = "home";
    State._navTab = "home";
    this.enterNavMode();
    if(!this._animateNav) this._setNavPage(0, false);
    this._updateTabbar("home");

    /* 原生 Toolbar: 如果有性格测试数据, 用段选器; 否则用标题 */
    if(State.ptQuestions && window.DJIBridge && DJIBridge.showToolbarTabs){
      const h = DJIBridge.getToolbarHeight ? DJIBridge.getToolbarHeight() : 0;
      document.documentElement.style.setProperty('--sat', h + 'px');
      DJIBridge.showToolbarTabs(JSON.stringify([
        {id:"quiz", label:"行测"},
        {id:"personality", label:"性格测试"}
      ]), tab);
      document.body.classList.add('native-toolbar');
    } else if(State.ptQuestions){
      this._syncNativeToolbar("大疆 2026", false);
    } else {
      this._syncNativeToolbar("大疆行测 2026", false);
    }
    this.setTitle("大疆 2026");

    if(tab === 'personality' && State.ptQuestions){
      this._renderPersonalityHome();
    } else {
      this._renderQuizHome();
    }
  },

  switchHomeTab(tab){
    this.goHome(tab);
  },

  _renderQuizHome(){
    const cats = State.meta.categories;
    const totalAnswered = Object.keys(State.storage.records).length;
    const totalCorrect = Object.values(State.storage.records).filter(r => r.last && r.last.correct).length;
    const accuracy = State.meta.total ? Math.round(totalCorrect*100/State.meta.total) : 0;

    const catOrder = (State.storage.settings && State.storage.settings.catOrder) || "sequential";
    const catOrderBtn = (v, label) =>
      `<button class="${catOrder===v?'active':''}" onclick="app.setCatOrder('${v}')">${label}</button>`;

    const catHtml = Object.entries(cats).map(([name,count])=>
      `<button class="btn-tile cat" onclick="app.startCat('${escapeHtml(name)}')">
         <svg class="icon"><use href="${catIconRef(name)}"/></svg>
         <div class="t-title">${escapeHtml(name)}</div>
         <div class="t-sub">${count} 题</div>
       </button>`
    ).join("");
    const catCols = Object.keys(cats).length <= 2 ? 2 : (Object.keys(cats).length === 3 ? 3 : 4);

    /* Web 段选器 (非原生 Toolbar 时) */
    const segHtml = State.ptQuestions && !document.body.classList.contains('native-toolbar')
      ? `<div class="page-head" style="justify-content:center;padding-top:6px;padding-bottom:6px">
          <div class="seg" style="margin:0 auto">
            <button class="active" onclick="app.switchHomeTab('quiz')">行测</button>
            <button onclick="app.switchHomeTab('personality')">性格测试</button>
          </div>
        </div>` : '';

    document.getElementById("panel-home").innerHTML = `
      ${segHtml}
      <div class="section">
        <div class="stats-row">
          <div class="stat-cell"><div class="num">${totalAnswered} <span style="font-size:.6em;color:var(--muted);font-weight:400">/ ${State.meta.total}</span></div><div class="label">已做</div></div>
          <div class="stat-cell"><div class="num" style="color:var(--success)">${totalCorrect}</div><div class="label">正确</div></div>
          <div class="stat-cell"><div class="num">${accuracy}%</div><div class="label">正确率</div></div>
          <div class="stat-cell"><div class="num" style="color:var(--danger)">${State.storage.wrongBook.length}</div><div class="label">错题</div></div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px">
          <span style="font-size:12px;color:var(--muted)">题目总览</span>
          <div class="seg">
            <button class="active" onclick="app.switchHeatmap('mastery')">掌握度</button>
            <button onclick="app.switchHeatmap('freq')">做题次数</button>
          </div>
        </div>
        <div id="heatmap-wrap"></div>
      </div>

      <div class="section">
        <div class="section-title" style="display:flex;align-items:center;justify-content:space-between">
          <span>分类练习</span>
          <div class="seg">
            ${catOrderBtn('sequential','顺序')}
            ${catOrderBtn('random','随机')}
            ${catOrderBtn('fullRandom','全随机')}
          </div>
        </div>
        <div class="btn-grid cols-${catCols}">${catHtml}</div>
      </div>

      <div class="section" style="border-top:none;padding-top:0">
        <div class="section-title">答题模式</div>
        <div class="btn-grid cols-3" style="margin-bottom:10px">
          <button class="btn-tile" onclick="app.startMode('sequential')">
            <svg class="icon"><use href="#i-list-ordered"/></svg>
            <div class="t-title">顺序答题</div>
            <div class="t-sub">按题号作答</div>
          </button>
          <button class="btn-tile" onclick="app.startMode('random')">
            <svg class="icon"><use href="#i-shuffle"/></svg>
            <div class="t-title">随机答题</div>
            <div class="t-sub">打乱题序</div>

  startPersonality(mode, category){
    let pool = State.ptQuestions.filter(q=>q.options); // exclude ranking type
    if(category) pool = pool.filter(q=>q.category===category);
    const shuffleOpts = mode === 'fullRandom';
    if(mode === 'random' || mode === 'fullRandom') pool = shuffle(pool);
    const shuffledOptions = {};
    if(shuffleOpts){
      pool.forEach(q=>{
        const keys = Object.keys(q.options);
        shuffledOptions[q.id] = shuffle(keys);
      });
    }
    State.session = {
      mode: "personality",
      category: category || null,
      questions: pool,
      index: 0,
      answers: {},
      marked: new Set(),
      startTime: Date.now(),
      immediateFeedback: true,
      finished: false,
      isPersonality: true,
      shuffledOptions: shuffleOpts ? shuffledOptions : null,
    };
    this.renderQuiz();
  },

  startPersonalityCat(name){
    const order = (State.storage.settings && State.storage.settings.ptCatOrder) || 'sequential';
    this.startPersonality(order, name);
  },

    if(!State.storage.settings) State.storage.settings = {};

      mode: "study",
      category: category || null,
      questions: pool,

      startTime: Date.now(),

  switchPtHeatmap(mode){
    const wrap = document.getElementById('pt-heatmap-wrap');
    if(!wrap) return;
    const seg = wrap.parentElement.querySelector('.seg');
    if(seg) seg.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.textContent === (mode==='mastery'?'掌握度':'做题次数')));
    const ptRec = State.storage.ptRecords || {};
    const ptPool = State.ptQuestions.filter(q=>q.options);
    let cells, legend;
    if(mode === 'freq'){
      cells = ptPool.map(q=>{
        const rec = ptRec[q.id];
        if(!rec) return '<div class="hm-cell" title="#'+q.id+' 0次"></div>';
        return '<div class="hm-cell f1" title="#'+q.id+' 1次"></div>';
      }).join('');
      legend = '<span><i style="background:var(--card-2)"></i>未做</span><span><i style="background:var(--hm-f1)"></i>已做</span>';
    } else {
      cells = ptPool.map(q=>{
        const rec = ptRec[q.id];
        if(!rec) return '<div class="hm-cell" title="#'+q.id+' 未做"></div>';
        if(rec.correct) return '<div class="hm-cell lv4" title="#'+q.id+' 正确"></div>';
        return '<div class="hm-cell lv1" title="#'+q.id+' 错误"></div>';
      }).join('');
      legend = '<span><i style="background:var(--card-2)"></i>未做</span><span><i style="background:#ef4444;opacity:.55"></i>错误</span><span><i style="background:#22c55e"></i>正确</span>';
    }
    wrap.innerHTML = '<div class="heatmap">'+cells+'</div><div class="heatmap-legend">'+legend+'</div>';
  },

  switchHeatmap(mode){
    const wrap = document.getElementById('heatmap-wrap');
    if(!wrap) return;
    // update seg buttons
    const seg = wrap.parentElement.querySelector('.seg');
    if(seg) seg.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.textContent === (mode==='mastery'?'掌握度':'做题次数')));
    let cells, legend;
    if(mode === 'freq'){
      cells = State.questions.map(q=>{
        const rec = State.storage.records[q.id];
        if(!rec) return '<div class="hm-cell" title="#'+q.id+' 0次"></div>';
        const n = rec.attempts;
        let f; if(n===1) f='f1'; else if(n===2) f='f2'; else if(n<=4) f='f3'; else f='f4';
        return '<div class="hm-cell '+f+'" title="#'+q.id+' '+n+'次"></div>';
      }).join('');
      legend = '<span><i style="background:var(--card-2)"></i>0次</span><span><i style="background:var(--hm-f1)"></i>1次</span><span><i style="background:var(--hm-f2)"></i>2次</span><span><i style="background:var(--hm-f3)"></i>3-4次</span><span><i style="background:var(--hm-f4)"></i>5次+</span>';
    } else {
      cells = State.questions.map(q=>{
        const rec = State.storage.records[q.id];
        if(!rec) return '<div class="hm-cell" title="#'+q.id+' 未做"></div>';
        const rate = rec.attempts ? rec.correct/rec.attempts : 0;
        let lv, label;
        if(rec.streak >= 3 || rate === 1){ lv='lv4'; label='已掌握'; }
        else if(rec.attempts >= 2 && rate >= 0.5){ lv='lv3'; label='学习中'; }
        else if(rec.attempts >= 2){ lv='lv2'; label='反复错'; }
        else { lv='lv1'; label='初见错'; }
        return '<div class="hm-cell '+lv+'" title="#'+q.id+' '+label+' ('+rec.correct+'对/'+rec.wrong+'错)"></div>';
      }).join('');
      legend = '<span><i style="background:var(--card-2)"></i>未做</span><span><i style="background:#ef4444;opacity:.55"></i>初见错</span><span><i style="background:#ef4444"></i>反复错</span><span><i style="background:#eab308"></i>学习中</span><span><i style="background:#22c55e"></i>已掌握</span>';
    }
    wrap.innerHTML = '<div class="heatmap">'+cells+'</div><div class="heatmap-legend">'+legend+'</div>';
  },

  startMode(mode, category, fullRandom){
    let pool = State.questions.slice();
    if(category) pool = pool.filter(q => q.category === category);
    if(mode === "random") pool = shuffle(pool);

    let startIndex = 0;
    if(mode === 'study'){
      const key = 'studyProgress_' + (category || '__ALL__');
      if(State.storage.studyProgress && State.storage.studyProgress[key] !== undefined){
        startIndex = Math.min(State.storage.studyProgress[key], pool.length - 1);
      }
    }

    // 全随机: 为每题生成打乱的选项键序列
    let shuffledOptions = null;
    if(fullRandom){
      shuffledOptions = {};
      for(const q of pool){
        const keys = ["A","B","C","D","E"].filter(k => q.options[k] !== undefined);
        shuffledOptions[q.id] = shuffle(keys);
      }
    }

    State.session = {
      mode,
      category: category || null,
      questions: pool,
      index: startIndex,
      answers: {},       // qid -> 所选
      marked: new Set(Object.keys(State.storage.marks || {})),
      startTime: Date.now(),
      immediateFeedback: mode !== "exam",
      studyMode: mode === "study",
      finished: false,
      shuffledOptions,
    };
    // 背题模式: 恢复持久化的答题记录
    if(mode === 'study' && State.storage.studyAnswers){
      for(const q of pool){
        if(State.storage.studyAnswers[q.id] !== undefined){
          State.session.answers[q.id] = State.storage.studyAnswers[q.id];
        }
      }
    }
    this.renderQuiz();
  },

  startExam(){
    const EXAM_TOTAL = 90;
    const EXAM_MINUTES = 45;
    const JITTER = 2; // 每类 ±2 扰动

    // 按分类分组
    const byCat = {};
    for(const q of State.questions){
      (byCat[q.category] = byCat[q.category] || []).push(q);
    }
    const cats = Object.keys(byCat);
    const total = State.questions.length;
    // 先计算每类目标数 (按比例 + 扰动)
    const targets = {};
    cats.forEach(c=>{
      const base = Math.round(byCat[c].length * EXAM_TOTAL / total);
      const jitter = Math.floor(Math.random() * (JITTER*2+1)) - JITTER;
      targets[c] = Math.max(1, Math.min(byCat[c].length, base + jitter));
    });
    // 调整总数到 EXAM_TOTAL
    let sum = cats.reduce((a,c)=>a+targets[c],0);
    while(sum !== EXAM_TOTAL){
      // 随机挑一类调 +1 / -1
      const c = cats[Math.floor(Math.random()*cats.length)];
      if(sum < EXAM_TOTAL && targets[c] < byCat[c].length){ targets[c]++; sum++; }
      else if(sum > EXAM_TOTAL && targets[c] > 1){ targets[c]--; sum--; }
    }
    // 从每类里随机抽取目标数题, 合并 + 打乱顺序 (同 dupGroup 只取一题)
    const usedDupGroups = new Set();
    let pool = [];
    cats.forEach(c=>{
      const shuffled = shuffle(byCat[c].slice());
      const picked = [];
      for(const q of shuffled){
        if(picked.length >= targets[c]) break;
        if(q.dupGroup && usedDupGroups.has(q.dupGroup)) continue;
        picked.push(q);
        if(q.dupGroup) usedDupGroups.add(q.dupGroup);
      }
      pool = pool.concat(picked);
    });
    pool = shuffle(pool);

    State.session = {
      mode:"exam",
      category:null,
      questions: pool,
      index:0,
      answers:{},
      marked: new Set(Object.keys(State.storage.marks || {})),
      startTime: Date.now(),
      immediateFeedback: true,
      finished: false,
      scoredAt: null,
      examDurationSec: EXAM_MINUTES*60,
      examEndTime: Date.now() + EXAM_MINUTES*60*1000,
      examComposition: targets, // 抽题分布 (展示)
    };
    this.renderQuiz();
    this.startExamTimer();
  },

  startExamTimer(){
    if(this._timer) clearInterval(this._timer);
    this._timer = setInterval(()=>{
      const s = State.session;
      if(!s || s.mode!=="exam" || s.finished){
        clearInterval(this._timer); this._timer=null; return;
      }
      const now = Date.now();
      const el = document.getElementById("examTimer");
      const remain = Math.floor((s.examEndTime - now)/1000);
      if(el){
        el.textContent = formatTime(remain);
        el.classList.toggle("urgent", remain <= 60);
      }
      if(remain <= 0){
        this.examTimeout();
      }
    }, 500);
  },

  // 超时: 未答题判错, 直接进入结果页
  examTimeout(){
    const s = State.session;
    if(!s || s.mode !== 'exam') return;
    // 未答题记录为错误
    for(const q of s.questions){
      if(s.answers[q.id] === undefined){
        s.answers[q.id] = '__TIMEOUT__';
        recordAnswer(q.id, '__TIMEOUT__', false);
      }
    }
    s.scoredAt = Date.now();
    this.updateWrongCount();
    if(this._timer){ clearInterval(this._timer); this._timer=null; }
    s.finished = true;
    this.renderResult();
    setTimeout(()=>{
      const total = s.questions.length;
      const correct = s.questions.filter(q => s.answers[q.id] === q.answer).length;
      alert(`⏰ 时间到，已自动交卷\n得分: ${Math.round(correct*100/total)}  (${correct}/${total})`);
    }, 50);
  },

  /* ========= 答题界面渲染 ========= */
  renderQuiz(){
    const s = State.session;
    if(!s) return this.goHome();
    if(s.questions.length === 0){
      document.getElementById("app").innerHTML = `<div class="empty">该条件下暂无题目</div><button class="btn-ghost" onclick="app.goHome()">返回</button>`;
      return;
    }
    const q = s.questions[s.index];
    const answered = s.answers[q.id] !== undefined;
    const userAns = s.answers[q.id];
    const showFeedback = s.immediateFeedback && answered;

    const modeLabel = { sequential:"顺序答题", random:"随机答题", category:`分类·${s.category||""}`, exam:"模拟考试", wrongbook:"错题本", fav:"收藏夹", study:`背题·${s.category||"全部"}`, personality: s.category ? `性格·${s.category}` : "性格测试" }[s.mode] || s.mode;

    const imgHtml = (q.images && q.images.length)
      ? `<div class="q-images">${q.images.map(f=>`<img src="images/${escapeHtml(f)}" alt="题图" loading="lazy">`).join("")}</div>`
      : "";

    const tableHtml = q.table ? (()=>{
      const t = q.table;
      const cell = (tag,c)=> typeof c==='object'&&c!==null
        ? `<${tag} colspan="${c.colspan||1}">${escapeHtml(c.text)}</${tag}>`
        : `<${tag}>${escapeHtml(String(c))}</${tag}>`;
      let h = '<div class="q-table"><table>';
      if (t.headers && t.headers.length) h += '<tr>' + t.headers.map(c=>cell('th',c)).join('') + '</tr>';
      t.rows.forEach(r=>{ h += '<tr>' + r.map(c=>cell('td',c)).join('') + '</tr>'; });
      return h + '</table></div>';
    })() : "";

    const origKeys = ["A","B","C","D","E"].filter(k => q.options[k] !== undefined);
    const optKeys = (s.shuffledOptions && s.shuffledOptions[q.id]) || origKeys;
    const labels = origKeys; // 显示标签始终为 A,B,C,D...
    const optionsHtml = optKeys.map((k,i)=>{
      const label = labels[i];
      const selected = userAns === k;
      let cls = "option";
      if(s.studyMode){
        if(selected && k === q.answer) cls += " correct";
        else if(selected && k !== q.answer) cls += " wrong";
      }else if(s.immediateFeedback && answered){
        cls += " disabled";
        if(k === q.answer) cls += " correct";
        else if(selected && k !== q.answer) cls += " wrong";
      }else if(s.finished){
        cls += " disabled";
        if(k === q.answer) cls += " correct";
        else if(selected && k !== q.answer) cls += " wrong";
      }else{
        if(selected) cls += " selected";
      }
      return `<li class="${cls}" onclick="app.selectOption('${k}')">
        <span class="letter">${label}</span><span class="text">${escapeHtml(q.options[k])}</span>
      </li>`;
    }).join("");

    // 背题模式: 标准答案信息移至解析区首行
    const studyBanner = "";

    let feedbackHtml = "";
    if(s.studyMode){
      const answerLine = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <span style="font-size:13px;color:var(--muted)">标准答案</span>
        <span style="font-size:22px;font-weight:700;color:var(--success)">${q.answer}</span>
      </div>`;
      const inner = `<div class="explanation">${answerLine}<span class="ex-label">解析</span><span class="ex-body">${q.explanation ? escapeHtml(q.explanation) : "暂无解析"}</span></div>`;
      const defaultOpen = State.storage.settings && State.storage.settings.studyShowAnswer;
      feedbackHtml = `<button class="study-reveal-btn"${defaultOpen?' style="display:none"':''} onclick="app.toggleStudyReveal(this)"><svg class="icon"><use href="#i-eye"/></svg> 查看答案与解析</button><div class="study-reveal-content${defaultOpen?' open':''}">${inner}</div>`;
    }else if(showFeedback){
      const ok = userAns === q.answer;
      feedbackHtml = `<div class="feedback ${ok?"ok":"no"}">${ok?'<svg class="icon"><use href="#i-check"/></svg>回答正确':'<svg class="icon"><use href="#i-x"/></svg>回答错误，正确答案：' + q.answer}</div>`;
      if(q.explanation){
        feedbackHtml += `<div class="explanation"><span class="ex-label">解析</span><span class="ex-body">${escapeHtml(q.explanation)}</span></div>`;
      }
    }
    if(s.finished){
      const ok = userAns === q.answer;
      feedbackHtml = userAns !== undefined
        ? `<div class="feedback ${ok?"ok":"no"}">${ok?'<svg class="icon"><use href="#i-check"/></svg>回答正确':'<svg class="icon"><use href="#i-x"/></svg>你的答案：' + (userAns||"未答") + "，正确答案：" + q.answer}</div>`

        feedbackHtml += `<div class="explanation"><span class="ex-label">解析</span><span class="ex-body">${escapeHtml(q.explanation)}</span></div>`;

    const progressPct = Math.round((s.index+1) / s.questions.length * 100);

    // 统计

      const a = s.answers[qq.id];
      if(a !== undefined){
        if(s.finished || s.immediateFeedback){
          cls.push(a === qq.answer ? "correct" : "wrong");
        }else{
          cls.push("answered");
        }
      }
      return `<button class="${cls.join(" ")}" onclick="app.gotoIndex(${idx})">${idx+1}</button>`;
    }).join("");

    const statsHtml = `<span style="color:var(--success)">${okCount}对</span> / <span style="color:var(--danger)">${noCount}错</span> / <span style="color:var(--warn)">${s.marked.size}标</span>`;

    const drawerHtml = `
      <div class="drawer-mask" id="drawerMask" onclick="app.closeDrawer()"></div>
      <aside class="drawer" id="drawer">
        <div class="drawer-top">
          <div class="drawer-section" style="display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap">
            <span style="font-size:14px;font-weight:600;color:var(--primary)">${escapeHtml(modeLabel)}</span>
            <span style="font-size:12px;color:var(--muted)">${statsHtml}</span>
            <span style="font-size:12px;color:var(--muted)">${s.index+1} / ${s.questions.length}</span>
          </div>
          <div class="drawer-section" style="display:flex;gap:8px">
            <button class="btn-ghost" style="flex:1" onclick="app.goHome()"><svg class="icon"><use href="#i-home"/></svg> 返回首页</button>
            ${s.mode !== "exam" && !s.finished
              ? `<button class="btn-success" style="flex:1" onclick="app.finishPractice()">完成练习</button>`
              : ""}
          </div>
        </div>
        <div class="drawer-grid-wrap">
          <div class="drawer-section">
            <div class="q-jumper" id="qJumper">${jumperHtml}</div>
          </div>
        </div>
      </aside>`;

    // ===== 底栏 =====
    const isLast = s.index === s.questions.length - 1;
    let rightBtn;
    if(s.mode === "exam" && !s.finished){
      if(isLast){
        rightBtn = `<button class="btn-danger" onclick="app.submitExam()">交卷</button>`;
      }else{
        rightBtn = `<button class="btn-primary" onclick="app.next()">下一题 <svg class="icon"><use href="#i-arrow-right"/></svg></button>`;
      }
    }else if(!s.finished && isLast && s.mode !== "study"){
      rightBtn = `<button class="btn-success" onclick="app.finishPractice()">完成练习</button>`;
    }else{
      rightBtn = `<button class="btn-primary" ${isLast?"disabled":""} onclick="app.next()">下一题 <svg class="icon"><use href="#i-arrow-right"/></svg></button>`;
    }
    const bottombarHtml = `
      <nav class="bottombar">
        <button class="btn-ghost" ${s.index===0?"disabled":""} onclick="app.prev()"><svg class="icon"><use href="#i-arrow-left"/></svg> 上一题</button>
        ${rightBtn}
      </nav>`;

    // ===== 主区 =====
    const mainHtml = `
      <div class="quiz-scroll">
        <div class="question-card">
          <div class="q-header">
            <span class="q-num">第 ${s.index+1} 题</span>
            <div class="q-tags">
              <span class="tag">${escapeHtml(q.category||"未分类")}</span>
              ${q.type==="graphic"?'<span class="tag" style="background:#fff7e6;color:#d48806">图形</span>':''}
              <span class="tag" title="原书页码">P${q.page}</span>
              ${(() => {
                const rec = State.storage.records[q.id];
                const ever = (State.storage.everWrong && State.storage.everWrong[q.id]) || 0;
                const inBook = State.storage.wrongBook.includes(q.id);
                if(inBook){
                  const streak = (rec && rec.streak) || 0;
                  return `<span class="tag" style="background:#fff1f0;color:var(--danger)" title="连续答对 ${streak}/3 次移出">错题 ${streak}/3</span>`;
                }else if(ever > 0){
                  return `<span class="tag" style="background:#f6ffed;color:var(--success)" title="曾错 ${ever} 次">曾错 ${ever}</span>`;
                }
                return "";
              })()}
            </div>
          </div>
          <div class="q-stem">${escapeHtml(q.question)}</div>
          ${imgHtml}${tableHtml}
          ${studyBanner}
          <ul class="options">${optionsHtml}</ul>
          ${feedbackHtml}
        </div>
      </div>`;

    document.getElementById("app").innerHTML = topbarHtml + drawerHtml + mainHtml + bottombarHtml;

    // 左右滑动切换题目
    const scrollEl = document.querySelector('.quiz-scroll');
    if(scrollEl){
      let sx=0, sy=0, swiped=false;
      scrollEl.addEventListener('touchstart', e=>{
        sx = e.touches[0].clientX; sy = e.touches[0].clientY; swiped = false;
      }, {passive:true});
      scrollEl.addEventListener('touchend', e=>{
        if(swiped) return;
        const dx = e.changedTouches[0].clientX - sx;
        const dy = e.changedTouches[0].clientY - sy;
        if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5){
          swiped = true;
          if(dx < 0) app.next(); else app.prev();
        }
      }, {passive:true});
    }
  },

  /* ========= 交互动作 ========= */
  toggleStudyReveal(btn){
    const content = btn.nextElementSibling;
    if(content) content.classList.toggle('open');
    btn.style.display = content.classList.contains('open') ? 'none' : '';
  },
  selectOption(letter){
    const s = State.session;
    if(!s || s.finished) return;
    const q = s.questions[s.index];
    // 性格测试: 记录到 ptRecords
    if(s.isPersonality && !s.studyMode){
      if(s.answers[q.id] !== undefined) return;
      s.answers[q.id] = letter;
      if(!State.storage.ptRecords) State.storage.ptRecords = {};
      const correct = letter === q.answer;
      State.storage.ptRecords[q.id] = { selected: letter, correct, time: Date.now() };
      // 错题本管理
      if(!State.storage.ptWrongBook) State.storage.ptWrongBook = [];
      const wrongSet = new Set(State.storage.ptWrongBook);
      if(!correct) wrongSet.add(q.id);
      else wrongSet.delete(q.id);
      State.storage.ptWrongBook = [...wrongSet];
      saveStorage();
      this.renderQuiz();
      if(s.index < s.questions.length - 1){
        setTimeout(()=>{ s.index++; this.renderQuiz(); }, 350);
      }
      return;
    }
    // 性格测试背题模式
    if(s.isPersonality && s.studyMode){
      s.answers[q.id] = letter;
      if(!State.storage.ptStudyAnswers) State.storage.ptStudyAnswers = {};
      State.storage.ptStudyAnswers[q.id] = letter;
      saveStorage();
      if(letter === q.answer && s.index < s.questions.length - 1){
        this.renderQuiz();
        setTimeout(()=>{ s.index++; this._savePtStudyProgress(); this.renderQuiz(); }, 350);
      }else{
        this.renderQuiz();
      }
      return;
    }
    // 背题模式: 不记录 records, 允许重复选择
    if(s.studyMode){
      s.answers[q.id] = letter;
      if(!State.storage.studyAnswers) State.storage.studyAnswers = {};
      State.storage.studyAnswers[q.id] = letter;
      saveStorage();
      if(letter === q.answer && s.index < s.questions.length - 1){
        this.renderQuiz();
        setTimeout(()=>{ s.index++; this._saveStudyProgress(); this.renderQuiz(); }, 350);
      }else{
        this.renderQuiz();
      }
      return;
    }
    // 立即反馈模式下，答过就不允许再改
    if(s.immediateFeedback && s.answers[q.id] !== undefined) return;
    s.answers[q.id] = letter;
    if(s.immediateFeedback){
      recordAnswer(q.id, letter, letter === q.answer);
    }
    this.renderQuiz();
    this.updateWrongCount();
  },
  prev(){ if(State.session.index>0){State.session.index--; this._saveStudyProgress(); this.renderQuiz();} },
  next(){ if(State.session.index<State.session.questions.length-1){State.session.index++; this._saveStudyProgress(); this.renderQuiz();} },
  gotoIndex(i){ State.session.index = i; this.closeDrawer(); this._saveStudyProgress(); this.renderQuiz(); },
  _saveStudyProgress(){
    const s = State.session;
    if(!s || !s.studyMode) return;
    if(s.isPersonality){ this._savePtStudyProgress(); return; }
    const key = 'studyProgress_' + (s.category || '__ALL__');
    if(!State.storage.studyProgress) State.storage.studyProgress = {};
    State.storage.studyProgress[key] = s.index;
    saveStorage();
  },
  _savePtStudyProgress(){
    const s = State.session;
    if(!s || !s.studyMode || !s.isPersonality) return;
    const key = 'ptStudyProgress_' + (s.category || '__ALL__');
    if(!State.storage.ptStudyProgress) State.storage.ptStudyProgress = {};
    State.storage.ptStudyProgress[key] = s.index;
    saveStorage();
  },
  toggleMark(){
    const s = State.session;
    const q = s.questions[s.index];
    if(!State.storage.marks) State.storage.marks = {};
    if(s.marked.has(q.id)){ s.marked.delete(q.id); delete State.storage.marks[q.id]; }
    else { s.marked.add(q.id); State.storage.marks[q.id] = true; }
    saveStorage();
    this.renderQuiz();
  },
  toggleDrawer(){
    const d = document.getElementById("drawer");
    const m = document.getElementById("drawerMask");
    const t = document.getElementById("tbTitle");
    if(!d) return;
    const open = !d.classList.contains("open");
    d.classList.toggle("open", open);
    m.classList.toggle("open", open);
    if(t) t.classList.toggle("open", open);
    const pb = document.querySelector('.quiz-pbar');
    if(pb) pb.classList.toggle("expanded", open);
    if(open){
      requestAnimationFrame(()=>{
        const wrap = d.querySelector('.drawer-grid-wrap');
        const cur = d.querySelector('.q-jumper .current');
        if(wrap && cur) wrap.scrollTop = cur.offsetTop - wrap.clientHeight / 2 + cur.offsetHeight / 2;
      });
    }
  },
  closeDrawer(){
    const d = document.getElementById("drawer");
    const m = document.getElementById("drawerMask");
    const t = document.getElementById("tbTitle");
    if(d) d.classList.remove("open");
    if(m) m.classList.remove("open");
    if(t) t.classList.remove("open");
    const pb = document.querySelector('.quiz-pbar');
    if(pb) pb.classList.remove("expanded");
  },
  async confirmExit(){
    const s = State.session;
    if(!s){ this.goHome(); return; }
    const ptTab = s.isPersonality ? 'personality' : undefined;
    if(s.finished){ this.goHome(ptTab); return; }
    // 保存背题进度
    if(s.studyMode){
      if(s.isPersonality) this._savePtStudyProgress();
      else {
        const key = 'studyProgress_' + (s.category || '__ALL__');
        if(!State.storage.studyProgress) State.storage.studyProgress = {};
        State.storage.studyProgress[key] = s.index;
        saveStorage();
      }
    }
    const answered = Object.keys(s.answers).length;
    if(s.mode === "exam" && !s.scored){
      if(!await showConfirm("考试尚未交卷，确定退出?", "退出", "继续考试")) return;
    }else if(!s.isPersonality && answered > 0 && s.mode !== "study"){
      if(!await showConfirm("当前练习尚未完成，确定返回首页？", "返回", "继续")) return;
    }
    this.goHome(ptTab);
  },

  /* ========= 系统返回键路由 (由 Android MainActivity 调用) ========= */
  onBack(){
    // 1. 抽屉开着先关抽屉
    const d = document.getElementById("drawer");
    if(d && d.classList.contains("open")){
      this.closeDrawer();
      return;
    }
    // 2. 答题中 (含错题刷题、背题、考试)
    if(State.session && !State.session.finished){
      this.confirmExit();
      return;
    }
    // 3. 根据当前页面决定
    switch(State.currentPage){
      case "result":
      case "picker-cat":
      case "picker-study":
      case "exam-setup":
        this.goHome();
        return;
      case "wrong":
      case "notebook":
      case "settings":
        this.goHome();
        return;
      case "home":
      default:
        // 首页: 直接退出 APP (Android)
        if(window.DJIBridge && typeof window.DJIBridge.exitApp === "function"){
          window.DJIBridge.exitApp();
        }
        return;
    }
  },

  finishPractice(){
    const s = State.session;
    s.finished = true;
    this.renderResult();
  },

  async submitExam(){
    const s = State.session;
    if(!s || s.mode !== "exam") return;
    const unanswered = s.questions.filter(q => s.answers[q.id]===undefined).length;
    if(unanswered > 0 && !await showConfirm(`还有 ${unanswered} 道题未作答，未答题将判为错误。确定现在交卷吗？`, '交卷', '继续答题')) return;
    // 未答题记录为错误
    for(const q of s.questions){
      if(s.answers[q.id] === undefined){
        s.answers[q.id] = '__UNANSWERED__';
        recordAnswer(q.id, '__UNANSWERED__', false);
      }
    }
    s.scoredAt = Date.now();
    this.updateWrongCount();
    if(this._timer){ clearInterval(this._timer); this._timer=null; }
    s.finished = true;
    this.renderResult();
  },

  renderResult(){
    const s = State.session;
    State.currentPage = "result";
    document.body.classList.remove("quiz-mode");
    document.body.classList.remove("nav-mode");
    document.getElementById("nav-pager").classList.add("hidden");
    document.getElementById("main-tabbar").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    this.closeDrawer();
    this._syncNativeToolbar("答题结果", false);
    this.setTitle("答题结果");
    const total = s.questions.length;
    // 使用当前 answers
    const ansMap = s.answers;
    const correct = s.questions.filter(q => ansMap[q.id] === q.answer).length;
    const wrong = s.questions.filter(q => ansMap[q.id] !== undefined && ansMap[q.id] !== q.answer).length;
    const unanswered = total - correct - wrong;
    const score = Math.round(correct/total*100);
    const durationSec = Math.floor(((s.scoredAt || Date.now()) - s.startTime)/1000);

    const reviewHtml = s.questions.map((q,idx)=>{
      const a = ansMap[q.id];
      let iconRef = "#i-x", color="var(--muted)", stateText="未答";
      if(a !== undefined){
        if(a === q.answer){ iconRef="#i-check"; color="var(--success)"; stateText="正确"; }
        else { iconRef="#i-x"; color="var(--danger)"; stateText="错误"; }
      }
      return `<button class="tile-btn" onclick="app.gotoIndex(${idx})">
        <span class="tb-icon" style="color:${color};border-color:${color}"><svg class="icon"><use href="${iconRef}"/></svg></span>
        <div class="tb-body">
          <div class="tb-title">第 ${idx+1} 题 · ${escapeHtml(q.question.slice(0,40))}${q.question.length>40?"…":""}</div>
          <div class="tb-sub">${escapeHtml(q.category)} · ${stateText}${a!==undefined?(" · 你答 "+a):""} · 正确 ${q.answer}</div>
        </div>
        <span class="tb-right">›</span>
      </button>`;
    }).join("");

    document.getElementById("app").innerHTML = `
      <div class="section" style="text-align:center;padding:24px 16px">
        <div class="score-big">${score}</div>
        <div class="score-label">正确率 ${correct}/${total}${s.mode==="exam"?` · 用时 ${formatTime(durationSec)}`:""}</div>
        <div style="display:flex;gap:24px;justify-content:center;flex-wrap:wrap;margin:16px 0 4px">
          <div><span style="color:var(--success);font-weight:600">${correct}</span> 正确</div>
          <div><span style="color:var(--danger);font-weight:600">${wrong}</span> 错误</div>
          <div><span style="color:var(--warn);font-weight:600">${unanswered}</span> 未答</div>
        </div>
      </div>
      <div class="section" style="display:flex;gap:10px">
        <button class="btn-ghost" style="flex:1" onclick="app.goHome()">返回首页</button>
        <button class="btn-primary" style="flex:1" onclick="app.reviewFinished()">查看详情</button>
      </div>
      <div class="section">
        <div class="section-title">题目回顾 (点击跳转)</div>
        <div class="tile-list">${reviewHtml}</div>
      </div>
    `;
  },

  reviewFinished(){
    State.session.index = 0;
    this.renderQuiz();
  },
};

window.addEventListener("DOMContentLoaded", ()=>{
  app.init();

  /* ========= 导航页滑动: CSS Scroll Snap + scrollend 检测 ========= */
  const scroller = document.getElementById('nav-scroll');
  const tabs = ['home','notebook','settings'];
  let _scrollTimer = null;

  function onSnapSettle(){
    if(!document.body.classList.contains('nav-mode')) return;
    if(app._navAnimating) return;
    const w = scroller.offsetWidth;
    if(!w) return;
    const idx = Math.round(scroller.scrollLeft / w);
    if(idx === (State._navIdx ?? 0)) return;
    State._navIdx = idx;
    State._navTab = tabs[idx];
    app._updateTabbar(tabs[idx]);
    app._animateNav = true;
    if(tabs[idx]==='home') app.goHome();
    else if(tabs[idx]==='notebook') app.showNotebookPage();
    else if(tabs[idx]==='settings') app.showSettings();
    app._animateNav = false;
  }

  // Use scrollend if available, fallback to debounced scroll
  if('onscrollend' in window){
    scroller.addEventListener('scrollend', onSnapSettle);
  } else {
    scroller.addEventListener('scroll', ()=>{
      clearTimeout(_scrollTimer);
      _scrollTimer = setTimeout(onSnapSettle, 120);
    }, {passive:true});
  }
});
document.addEventListener("click", ()=>{ const dd=document.getElementById("studyDd"); if(dd) dd.classList.remove("open"); });
</script>
